included:
  - Peptide
  - PeptideTests
  - PeptideUITests

excluded:
  - Peptide/Resources
  - PeptideTests
  - PeptideUITests

disabled_rules:
  - trailing_whitespace
  - line_length
  - type_body_length
  - file_length
  - function_body_length

opt_in_rules:
  - empty_count
  - closure_spacing
  - force_unwrapping
  - implicitly_unwrapped_optional

force_cast:
  severity: error

identifier_name:
  min_length:
    warning: 1
  excluded:
    - id
    - x
    - y
    - r
    - g
    - b

nesting:
  type_level: 2

# Every app-side target. Shared/ is compiled into four of them, so it is
# the last place to skip. The test targets are not linted yet: they lean on
# `x!` and `var app: XCUIApplication!`, which the error-level unwrap rules
# would reject wholesale.
included:
  - Peptide
  - Shared
  - WatchShared
  - PeptideWatch
  - PeptideWidgets
  - PeptideWatchWidgets

excluded:
  - Peptide/Resources

disabled_rules:
  - trailing_whitespace
  - trailing_comma
  - line_length
  - type_body_length
  - file_length
  - function_body_length
  - cyclomatic_complexity
  - large_tuple
  - function_parameter_count

opt_in_rules:
  - empty_count
  - closure_spacing
  - force_unwrapping
  - implicitly_unwrapped_optional

force_cast:
  severity: error

# empty_count is opt-in and defaults to warning in SwiftLint, but recent
# runner versions have promoted it to error severity. Pin it back to
# warning so a single legacy `count > 0` doesn't gate every PR while we
# work through the broader cleanup pass tracked in the lint TODO.
empty_count:
  severity: warning

identifier_name:
  min_length:
    warning: 1
  excluded:
    - id
    - x
    - y
    - r
    - g
    - b
    - protocol_

nesting:
  type_level: 2

custom_rules:
  # `Font.system(size:)` ignores the content-size category entirely, so any
  # body/label copy set this way is invisible to Dynamic Type. Use
  # `AppFont.scaled(_:weight:design:)` (Typography.swift) instead. Sizes above
  # 24pt are display glyphs and stay fixed on purpose, so they're allowed.
  fixed_font_size:
    name: "Fixed font size"
    regex: '\.system\(size:\s*(?:[0-9]|1[0-9]|2[0-4])(?:\.[0-9]+)?\s*[,)]'
    message: "Body-scale text must use AppFont.scaled(_:) so it honours Dynamic Type."
    severity: warning
    excluded: ".*/Typography\\.swift"

  # Feature views must go through AppColor so light mode, the brand themes,
  # and a future palette change are all a single edit. Domain palettes that
  # legitimately need literals live in ColorTheme.swift's whitelist.
  raw_color_literal:
    name: "Raw colour literal"
    regex: 'Color\((?:hex:\s*0x|red:\s*[0-9])'
    message: "Use an AppColor token instead of a raw Color literal."
    severity: warning
    included: ".*/Peptide/Features/.*"
    excluded: ".*(WhatsNewPage|MuscleMapView|CycleCardView|ProtocolNotesTimeline|AvatarPreset|HabitEditSheet|BarcodeScanFlow|ShareCardSheet)\\.swift"

<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/atlas.css">
<style>:root{ --accent: var(--amber); }</style>
</head><body>
<div class="frame">
  <div class="cap">
    <div class="kicker">Atlas Score</div>
    <div class="headline">A streak you<br>won't <span class="hl">break.</span></div>
    <div class="subhead">Every workout, meal, and habit earns one growing score.</div>
  </div>

  <div class="device">
    <div class="screen">
      <div class="statusbar"><div class="time">9:41</div><div class="sys">
        <svg width="38" height="28" viewBox="0 0 40 30"><g fill="#fff"><rect x="0" y="18" width="6" height="12" rx="2"/><rect x="9" y="12" width="6" height="18" rx="2"/><rect x="18" y="6" width="6" height="24" rx="2"/><rect x="27" y="0" width="6" height="30" rx="2"/></g></svg>
        <svg width="36" height="28" viewBox="0 0 38 30" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"><path d="M4 12 A 22 22 0 0 1 34 12"/><path d="M10 19 A 13 13 0 0 1 28 19"/><circle cx="19" cy="25" r="2.4" fill="#fff" stroke="none"/></svg>
        <svg width="56" height="28" viewBox="0 0 58 30"><rect x="1" y="4" width="46" height="22" rx="7" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2.5"/><rect x="4" y="7" width="40" height="16" rx="4" fill="#fff"/><rect x="50" y="11" width="4" height="8" rx="2" fill="#fff" fill-opacity=".6"/></svg>
      </div></div>
      <div class="grabber"></div>

      <div class="nav"><div class="col"><div class="title">Your Progress</div><div class="sub">You're on a 47-day roll</div></div></div>

      <div class="body" style="position:absolute;top:250px;left:0;right:0;bottom:46px;display:flex;flex-direction:column;justify-content:center;padding:0 48px;">
        <!-- HERO: medallion -->
        <div style="position:relative;display:flex;flex-direction:column;align-items:center;margin-top:24px;">
          <span class="spark" style="top:24px;left:118px;width:16px;height:16px;background:var(--amber);transform:rotate(20deg);"></span>
          <span class="spark" style="top:58px;right:104px;width:12px;height:24px;background:var(--violet);transform:rotate(-18deg);"></span>
          <span class="spark" style="top:8px;left:236px;width:14px;height:14px;background:var(--mint);border-radius:50%;"></span>
          <span class="spark" style="top:196px;left:18px;width:11px;height:11px;background:var(--mint);border-radius:50%;"></span>
          <span class="spark" style="top:210px;right:22px;width:15px;height:15px;background:var(--amber);transform:rotate(40deg);"></span>
          <span class="spark" style="top:120px;left:64px;width:10px;height:20px;background:var(--violet);transform:rotate(28deg);"></span>
          <span class="spark" style="top:104px;right:60px;width:12px;height:12px;background:var(--mint);border-radius:50%;"></span>
          <svg width="470" height="470" viewBox="0 0 470 470">
            <defs>
              <radialGradient id="medal" cx="0.4" cy="0.32" r="0.85"><stop offset="0" stop-color="#FFE39A"/><stop offset="0.45" stop-color="#F5A623"/><stop offset="1" stop-color="#7B3FE4"/></radialGradient>
              <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9BCFF"/><stop offset="1" stop-color="#8F76FF"/></linearGradient>
              <filter id="mglow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="15" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            </defs>
            <circle cx="235" cy="235" r="210" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="14"/>
            <circle cx="235" cy="235" r="210" fill="none" stroke="url(#arc)" stroke-width="14" stroke-linecap="round" stroke-dasharray="1319" stroke-dashoffset="290" transform="rotate(-90 235 235)" filter="url(#mglow)"/>
            <circle cx="235" cy="235" r="180" fill="url(#medal)" filter="url(#mglow)"/>
            <circle cx="235" cy="235" r="180" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
          </svg>
          <div style="position:absolute;top:0;height:470px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1A0E04;">
            <div style="font-size:24px;font-weight:800;letter-spacing:4px;opacity:.85;">★ LEVEL</div>
            <div class="hero" style="font-size:172px;letter-spacing:-4px;">14</div>
            <div style="font-size:33px;font-weight:800;letter-spacing:8px;">GOLD</div>
          </div>
        </div>
        <div style="text-align:center;font-size:24px;color:var(--muted);margin-top:12px;">1,240 pts to <b style="color:#C9BCFF;">Level 15 · Diamond</b></div>

        <!-- total -->
        <div style="display:flex;flex-direction:column;align-items:center;margin-top:24px;">
          <div class="hero" style="font-size:130px;letter-spacing:-4px;">12,480</div>
          <div class="row gap" style="margin-top:12px;"><div class="lab" style="font-size:33px;">ATLAS SCORE</div><div class="chip mint">▲ +48 today</div></div>
        </div>

        <!-- streaks -->
        <div class="row gap" style="margin-top:36px;">
          <div class="tile" style="flex:1;text-align:center;"><div style="font-size:48px;">🔥</div><div class="val" style="font-size:48px;">47</div><div class="lab">Habits</div></div>
          <div class="tile" style="flex:1;text-align:center;"><div style="font-size:48px;">💉</div><div class="val" style="font-size:48px;">23</div><div class="lab">Doses</div></div>
          <div class="tile" style="flex:1;text-align:center;"><div style="font-size:48px;">🍽️</div><div class="val" style="font-size:48px;">31</div><div class="lab">Meals</div></div>
        </div>

        <!-- climbing trend -->
        <div class="glass" style="margin-top:36px;padding:24px 36px 24px;">
          <div class="row between"><div class="lab" style="font-size:24px;">SCORE · LAST 30 DAYS</div><div class="chip mint">▲ 96% consistent</div></div>
          <svg width="100%" height="180" viewBox="0 0 900 180" preserveAspectRatio="none" style="margin-top:12px;">
            <defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F59E0B" stop-opacity="0.5"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></linearGradient></defs>
            <path d="M0 150 L64 146 L138 150 L212 126 L286 132 L360 102 L434 110 L508 78 L582 86 L656 50 L730 58 L820 28 L900 20 L900 180 L0 180 Z" fill="url(#area)"/>
            <path d="M0 150 L64 146 L138 150 L212 126 L286 132 L360 102 L434 110 L508 78 L582 86 L656 50 L730 58 L820 28 L900 20" fill="none" stroke="#F7B53D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="900" cy="20" r="10" fill="#fff"/><circle cx="900" cy="20" r="19" fill="none" stroke="#F7B53D" stroke-width="3" opacity="0.5"/>
          </svg>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>

<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/atlas.css">
<link rel="stylesheet" href="../assets/capture.css">
<style>:root{ --accent: var(--violet); }</style>
</head><body>
<div class="frame">
  <div class="cap">
    <div class="kicker">Recap</div>
    <div class="headline">A recap after<br><span class="hl">every workout.</span></div>
    <div class="subhead">Duration, sets, volume and muscles. Edit any detail later.</div>
  </div>

  <div class="device">
    <div class="screen capture">
      <div class="canvas">
        <img src="../captures/recap-dark.png" alt="">
        <div class="patch clock" style="left:160px;top:60px;width:190px;height:76px;background:#101013">9:41</div>
        <div class="patch big" style="left:100px;top:2316px;width:320px;height:108px;background:#1D1D21">48m</div>
        <div class="patch big" style="left:520px;top:2316px;width:270px;height:108px;background:#1D1D21">16</div>
        <div class="patch big" style="left:860px;top:2316px;width:400px;height:108px;background:#1D1D21">9,840 lb</div>
      </div>
    </div>
  </div>
</div>
</body></html>

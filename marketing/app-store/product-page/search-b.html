<!doctype html><html><head><meta charset="utf-8">
<title>Atlas search results B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="page.css">
<script src="phones.js"></script>
<style>
  /* 3:2 search results visual (A/B variant: lifestyle photo), 3840 × 2560. */
  html, body { width: 3840px; height: 2560px; }
  .copy { position: absolute; left: 300px; top: 230px; }
  .brand { font-size: 96px; margin-bottom: 60px; }
  .headline { font-size: 220px; }
  .photo {
    position: absolute; left: 300px; top: 1060px; width: 1900px; height: 1152px;
    border-radius: 80px; background: url('img/lifestyle.jpg') center / cover;
    box-shadow: 0 60px 140px rgba(26, 30, 48, 0.22);
  }
</style></head><body>
  <div class="copy">
    <div class="brand"><img src="img/icon.png" alt="">Atlas</div>
    <div class="headline">Every rep.<br><span class="grad">Every meal.</span></div>
  </div>
  <div class="photo"></div>
  <div class="phone" data-screen="meal" style="--w:700px;left:2760px;top:330px;transform:rotate(5deg)"></div>
  <div class="phone" data-screen="rest" style="--w:780px;left:2040px;top:560px;z-index:2"></div>
</body></html>

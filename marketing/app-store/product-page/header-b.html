<!doctype html><html><head><meta charset="utf-8">
<title>Atlas header B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="page.css">
<script src="phones.js"></script>
<style>
  /* 21:9 product page header (A/B variant: lifestyle photo), 3840 × 1646.
     Key content stays inside x 560–3280, y 170–1480. */
  html, body { width: 3840px; height: 1646px; }
  .copy { position: absolute; left: 600px; top: 50%; transform: translateY(-50%); width: 1200px; }
  .brand { font-size: 84px; margin-bottom: 70px; }
  .headline { font-size: 176px; }
  .sub { font-size: 62px; margin-top: 56px; width: 1050px; }
  .photo {
    position: absolute; left: 1820px; top: 300px; width: 1300px; height: 743px;
    border-radius: 64px; background: url('img/lifestyle.jpg') 30% center / cover;
    box-shadow: 0 50px 120px rgba(26, 30, 48, 0.22);
  }
</style></head><body>
  <div class="copy">
    <div class="brand"><img src="img/icon.png" alt="">Atlas</div>
    <div class="headline">Every rep.<br><span class="grad">Every meal.</span></div>
    <div class="sub">Log workouts and food in seconds, then see how your body responds.</div>
  </div>
  <div class="photo"></div>
  <div class="phone" data-screen="rest" style="--w:540px;left:2740px;top:290px;z-index:2"></div>
</body></html>

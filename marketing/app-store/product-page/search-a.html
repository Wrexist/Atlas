<!doctype html><html><head><meta charset="utf-8">
<title>Atlas search results A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="page.css">
<script src="phones.js"></script>
<style>
  /* 3:2 search results visual, 3840 × 2560 (Apple scales it down to 1920 × 1280). */
  html, body { width: 3840px; height: 2560px; }
  .copy { position: absolute; left: 0; right: 0; top: 190px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .brand { font-size: 96px; margin-bottom: 60px; }
  .headline { font-size: 230px; }
</style></head><body>
  <div class="copy">
    <div class="brand"><img src="img/icon.png" alt="">Atlas</div>
    <div class="headline">Train. Eat. <span class="grad">Recover.</span></div>
  </div>
  <div class="phone" data-screen="muscles" style="--w:700px;left:760px;top:870px;transform:rotate(-5deg)"></div>
  <div class="phone" data-screen="meal"    style="--w:700px;left:2380px;top:870px;transform:rotate(5deg)"></div>
  <div class="phone" data-screen="rest"    style="--w:780px;left:1530px;top:790px;z-index:2"></div>
</body></html>

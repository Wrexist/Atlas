<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/social.css">
</head><body>
<div class="tile" style="--accent:var(--violet);width:1080px;height:1080px;padding:66px;display:flex;flex-direction:column;
  background:radial-gradient(78% 50% at 50% -8%,rgba(123,92,255,0.34),transparent 60%),radial-gradient(60% 40% at 80% 90%,rgba(52,211,153,0.16),transparent 60%),linear-gradient(160deg,#0D0024,#0A0A10 60%,#08010F);">
  <div class="wordmark">
    <svg width="38" height="38" viewBox="0 0 100 100"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B6BFF"/><stop offset="1" stop-color="#34D399"/></linearGradient></defs><path d="M50 12 L84 84 L60 84 L50 58 L40 84 L16 84 Z" fill="url(#lg)"/></svg>
    ATLAS
  </div>

  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;">
    <div style="position:relative;width:560px;height:360px;">
      <svg width="560" height="360" viewBox="0 0 460 300">
        <defs>
          <linearGradient id="gauge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34D399"/><stop offset="0.5" stop-color="#A7F3D0"/><stop offset="1" stop-color="#F87171"/></linearGradient>
          <filter id="ng" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <path d="M40 250 A 190 190 0 0 1 420 250" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="36" stroke-linecap="round"/>
        <path d="M40 250 A 190 190 0 0 1 420 250" fill="none" stroke="url(#gauge)" stroke-width="36" stroke-linecap="round" filter="url(#ng)"/>
        <circle cx="58" cy="170" r="20" fill="none" stroke="#34D399" stroke-width="4" opacity="0.5"/>
        <circle cx="58" cy="170" r="12" fill="#fff" filter="url(#ng)"/>
      </svg>
      <div style="position:absolute;left:0;right:0;top:120px;text-align:center;"><div class="heronum" style="font-size:150px;color:var(--mint);text-shadow:0 0 50px rgba(52,211,153,0.7);">28.4</div></div>
    </div>
    <div class="chip mint" style="font-size:30px;padding:16px 32px;">▼ 3.6 years younger</div>
    <div class="h1" style="font-size:60px;text-align:center;margin-top:10px;">See your<br><span class="hl" style="color:var(--mint);">biological age.</span></div>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div class="sub" style="font-size:28px;">HRV · Sleep · Resting HR · Performance Age</div>
    <div class="chip violet">Atlas Pro</div>
  </div>
</div>
</body></html>

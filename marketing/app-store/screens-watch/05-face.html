<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/watch.css">
<style>
.comp{position:absolute;width:112px;height:112px;}
.comp .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.lbl{position:absolute;left:0;right:0;text-align:center;font-size:15px;font-weight:700;letter-spacing:1px;color:var(--faint);}
</style>
</head><body>
<div class="wframe" style="--accent:var(--violet);background:radial-gradient(120% 60% at 50% -10%,rgba(123,92,255,0.22),transparent 60%),#000;">

  <!-- TL: Atlas Score -->
  <div class="comp" style="top:22px;left:22px;">
    <svg width="112" height="112" viewBox="0 0 112 112"><circle cx="56" cy="56" r="48" fill="none" stroke="rgba(245,158,11,0.22)" stroke-width="9"/><circle cx="56" cy="56" r="48" fill="none" stroke="#F59E0B" stroke-width="9" stroke-linecap="round" stroke-dasharray="302" stroke-dashoffset="88" transform="rotate(-90 56 56)"/></svg>
    <div class="v"><div style="font-size:15px;font-weight:800;color:var(--amber);">LVL</div><div style="font-size:38px;font-weight:800;margin-top:-3px;">14</div></div>
  </div>
  <!-- TR: Recovery -->
  <div class="comp" style="top:22px;right:22px;">
    <svg width="112" height="112" viewBox="0 0 112 112"><circle cx="56" cy="56" r="48" fill="none" stroke="rgba(52,211,153,0.2)" stroke-width="9"/><circle cx="56" cy="56" r="48" fill="none" stroke="#34D399" stroke-width="9" stroke-linecap="round" stroke-dasharray="302" stroke-dashoffset="66" transform="rotate(-90 56 56)"/></svg>
    <div class="v"><div style="font-size:40px;font-weight:800;">78</div></div>
  </div>
  <!-- BL: Health habits -->
  <div class="comp" style="bottom:22px;left:22px;">
    <svg width="112" height="112" viewBox="0 0 112 112"><circle cx="56" cy="56" r="48" fill="none" stroke="rgba(96,165,250,0.2)" stroke-width="9"/><circle cx="56" cy="56" r="48" fill="none" stroke="#60A5FA" stroke-width="9" stroke-linecap="round" stroke-dasharray="302" stroke-dashoffset="76" transform="rotate(-90 56 56)"/></svg>
    <div class="v"><div style="font-size:34px;font-weight:800;">3/4</div></div>
  </div>
  <!-- BR: Next dose -->
  <div class="comp" style="bottom:22px;right:22px;">
    <svg width="112" height="112" viewBox="0 0 112 112"><circle cx="56" cy="56" r="48" fill="none" stroke="rgba(123,92,255,0.22)" stroke-width="9"/><circle cx="56" cy="56" r="48" fill="none" stroke="#7B5CFF" stroke-width="9" stroke-linecap="round" stroke-dasharray="302" stroke-dashoffset="150" transform="rotate(-90 56 56)"/></svg>
    <div class="v"><svg width="46" height="46" viewBox="0 0 24 24"><g transform="rotate(45 12 12)"><rect x="3" y="9" width="18" height="6" rx="3" fill="#C9BCFF"/><rect x="3" y="9" width="9" height="6" rx="3" fill="#fff" opacity="0.5"/></g></svg></div>
  </div>

  <!-- center time -->
  <div class="wcenter">
    <div style="font-size:30px;font-weight:700;letter-spacing:2px;color:var(--mint);">TUE 3</div>
    <div style="font-size:120px;font-weight:700;letter-spacing:-4px;line-height:.96;">10<span style="color:var(--violet);">:</span>09</div>
    <div style="font-size:24px;font-weight:700;color:var(--muted);letter-spacing:1px;">🔥 Atlas 12,480</div>
  </div>
</div>
</body></html>

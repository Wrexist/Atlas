<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="../assets/watch.css">
<script src="../assets/watch.js"></script>
</head><body>
<div class="page" style="--accent:var(--protocol);">
  <div class="chrome"><span class="title">Protocol</span><span class="time">10:09</span></div>
  <div class="body" style="top:calc(var(--pt)*40);gap:calc(var(--pt)*5);">
    <span style="font-size:calc(var(--pt)*13);font-weight:800;color:var(--protocol)">2 of 3 taken</span>
    <div style="height:calc(var(--pt)*5);border-radius:99px;background:color-mix(in srgb,var(--protocol) 22%,transparent);overflow:hidden;margin-bottom:calc(var(--pt)*2)"><i style="display:block;height:100%;width:66.7%;border-radius:99px;background:var(--protocol)"></i></div>
    <div class="dose"><span class="ck"></span><div><div class="name">MOTS-c</div><div class="amt">5 mg</div></div><span class="t">8:00 PM</span></div>
    <div class="dose done"><span class="ck on"></span><div><div class="name">BPC</div><div class="amt">250 mcg</div></div><span class="t">8:00 AM</span></div>
    <div class="dose done"><span class="ck on"></span><div><div class="name">TB-500</div><div class="amt">2 mg</div></div><span class="t">8:00 AM</span></div>
    <span style="font-size:calc(var(--pt)*10);color:var(--muted);font-weight:700">12-day streak · 93% this week</span>
  </div>
</div>
<style>
.dose{display:flex;align-items:center;gap:calc(var(--pt)*8);background:rgba(255,255,255,.1);border-radius:calc(var(--pt)*14);padding:calc(var(--pt)*6) calc(var(--pt)*10);}
.dose.done{background:color-mix(in srgb,var(--protocol) 16%,transparent);}
.dose .name{font-weight:800;font-size:calc(var(--pt)*14);line-height:1.1;}
.dose.done .name{color:rgba(255,255,255,.55);text-decoration:line-through;}
.dose .amt,.dose .t{font-size:calc(var(--pt)*10);color:rgba(255,255,255,.55);font-weight:700;}
.dose .t{margin-left:auto;}
.ck{width:calc(var(--pt)*19);height:calc(var(--pt)*19);border-radius:50%;box-shadow:inset 0 0 0 calc(var(--pt)*1.6) rgba(255,255,255,.5);flex:none;position:relative;}
.ck.on{background:var(--protocol);box-shadow:none;}
.ck.on::after{content:"";position:absolute;left:32%;top:22%;width:26%;height:44%;border:solid #000;border-width:0 calc(var(--pt)*2) calc(var(--pt)*2) 0;transform:rotate(45deg);}
</style>
</body></html>

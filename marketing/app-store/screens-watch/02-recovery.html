<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="../assets/watch.css">
<script src="../assets/watch.js"></script>
</head><body>
<div class="page" style="--accent:var(--heart);">
  <div class="chrome"><span class="corner" data-draw="icon.ecg"></span><span class="right"><span class="time">10:09</span><span class="subtitle">Recovery</span></span></div>
  <div class="body" style="top:calc(var(--pt)*36);">
    <div style="display:grid;place-items:center;height:calc(var(--pt)*74);" data-draw="heart(48)"></div>
    <div data-draw="ecg(182, 26)"></div>
    <span class="cap" style="margin-top:calc(var(--pt)*4)">Resting</span>
    <div><span class="big">56</span><span class="unit" style="color:var(--heart)">BPM</span></div>
    <div style="display:flex;gap:calc(var(--pt)*4);margin-top:calc(var(--pt)*5)"><span class="chip">Recovery 82</span><span class="chip">HRV 64 ms</span></div>
  </div>
</div>
</body></html>

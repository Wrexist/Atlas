<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="../assets/watch.css">
<script src="../assets/watch.js"></script>
</head><body>
<div class="page" style="--accent:var(--gold);">
  <div class="chrome"><span class="title">Today</span><span class="time">10:09</span></div>
  <div class="body center" style="top:calc(var(--pt)*38);gap:calc(var(--pt)*8);">
    <div data-draw="rings(132, [{p:2/3,c:'#5BC489',g:'heart'},{p:1/2,c:'#378ADD',g:'run'},{p:2/3,c:'#A78BFA',g:'pill'}], 14, 3)"></div>
    <div class="stats">
      <div><b style="color:var(--health)">2/3</b><span class="cap">Health</span></div>
      <div><b style="color:var(--training)">1/2</b><span class="cap">Training</span></div>
      <div><b style="color:var(--protocol)">2/3</b><span class="cap">Protocol</span></div>
    </div>
    <span class="pill" style="color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,transparent)">✦ 142 <span style="opacity:.7">Lv 3</span> <span style="color:var(--health)">+6</span></span>
  </div>
</div>
</body></html>

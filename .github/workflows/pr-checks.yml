name: PR Checks

# Cost model: macOS build-check is gated on (a) `draft == false`, so
# drafts run only the cheap Ubuntu jobs, and (b) the `filter` job's
# `ios` output, so docs/server/scripts-only PRs skip the macOS runner
# entirely. The `ready_for_review` event triggers the workflow when a
# draft is marked ready so the build kicks off without an extra push.
#
# There is deliberately no `labeled` trigger. A label run shared this
# workflow's concurrency group, so adding any label cancelled the
# in-flight build, and the label run then skipped the build and
# reported a green `pr-checks` for a commit nothing had compiled. Add
# `run-ui-tests` and push to have it take effect.
#
# Pushes to main and a nightly run catch what a PR cannot: a main that
# went red from a toolchain bump on the runner image, or from a commit
# that reached main without a PR.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read
  pull-requests: read
  # `actions: write` lets the Claude Code integration call
  # `rerun_failed_jobs` programmatically when a transient runner-
  # provisioning flake takes out a cheap Ubuntu job (proxy-checks /
  # filter). Avoids burning a fresh full-build cycle on the macOS
  # runner just to clear a flake.
  actions: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────── Path scope
  #
  # Cheap Ubuntu job (~10 s) that decides whether the macOS build is
  # worth running. Earlier attempts at this gate (dorny/paths-filter,
  # native git diff with `set -euo pipefail` + while-read loops)
  # failed in 2-3 s with no recoverable error surface. This rewrite
  # is fail-SAFE: if the diff cannot be computed for any reason,
  # `ios` defaults to `true` so we never silently skip a needed build.
  # A grep-against-explicit-SHAs replaces the prior bash case loop,
  # which removes the most likely culprits (set -u tripping on edge
  # cases, herestring quirks, multi-line case patterns).
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      ios: ${{ steps.scope.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect iOS scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Fail-safe default: if anything below errors out, run the
          # macOS build. Push and schedule runs have no base SHA, so the
          # diff fails and they always build. Skipping a needed build is far more expensive
          # (a red merged PR) than paying for one we didn't strictly
          # need.
          IOS=true

          if FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>&1); then
            echo "Diff $BASE_SHA..$HEAD_SHA:"
            echo "$FILES" | sed 's/^/  /'

            # Single grep against one regex — no bash case loops, no
            # backslash continuations. Any iOS-relevant prefix flips
            # ios to true; otherwise we skip the macOS runner.
            if echo "$FILES" | grep -qE '^(Peptide(Tests|UITests|Widgets|Watch|WatchWidgets)?/|Shared/|WatchShared/|fastlane/|project\.yml$|Gemfile(\.lock)?$|\.swiftlint\.yml$|\.github/workflows/(pr-checks|ios-testflight|release|binary-size)\.yml$)'; then
              IOS=true
              echo "→ iOS-relevant changes detected; build-check will run."
            else
              IOS=false
              echo "→ No iOS-relevant changes; build-check will be skipped."
            fi
          else
            echo "::warning::git diff failed — defaulting ios=true so the build still runs."
            echo "git output: $FILES"
            IOS=true
          fi

          echo "ios=$IOS" >> "$GITHUB_OUTPUT"

  build-check:
    needs: filter
    # Skip macOS entirely on docs/server-only PRs (filter says no iOS
    # changes) and on drafts. macos-15 runs at ~$0.062/min — a single
    # 15-min skip saves ~$0.93.
    if: >-
      needs.filter.outputs.ios == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: macos-15
    # 40, up from 25, because 25 killed a run whose tests were all
    # passing. Observed job wall-clock across five runs: 7.5, 12.8, 18.0,
    # 22.8, and 26.1 minutes — the last cut off mid-suite by the old
    # ceiling with every reported suite at zero failures.
    #
    # ~7-9 min of that is fixed overhead (checkout, xcodegen, build,
    # swiftlint, coverage, upload). The rest is the suite, which has
    # swung 138s to 841s, and the swing is almost entirely
    # StoreServiceTests: 95s, 263s, 578s, 777s for the same 15 tests.
    # Each builds its own `SKTestSession`, and that setup cost is at the
    # mercy of a shared macOS runner.
    #
    # A per-class session would collapse it, but sharing StoreKit
    # transaction state across tests is the exact cross-test bleed the
    # rest of this suite has been fixing, and this is the purchase path
    # — not a trade worth making for wall-clock. So: give the job room
    # to finish. This is a ceiling, not a duration; a normal run still
    # costs what it always did.
    #
    # The opt-in `run-ui-tests` path also runs ScreenshotTests. That step
    # took 14 min with ten tests failing early and pushed a labelled run
    # to 38m41s of the old 40 min ceiling; a passing suite takes longer.
    timeout-minutes: 75
    env:
      # Pinned so a tool upgrade is a reviewed diff, not a runner-image
      # or cache accident (.swiftlint.yml records one that changed the
      # gate). Bump both here and the cache key follows.
      XCODEGEN_VERSION: 2.46.0
      SWIFTLINT_VERSION: 0.65.1

    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: Cache pinned tools
        # Keyed on the job's pinned versions, so bumping one is a recorded
        # diff that refreshes the cache. The old Homebrew cache had a
        # constant key and froze whatever version it first saw (B344).
        uses: actions/cache@v6
        with:
          path: ~/.ci-tools
          key: ci-tools-${{ runner.os }}-${{ runner.arch }}-xcodegen-${{ env.XCODEGEN_VERSION }}-swiftlint-${{ env.SWIFTLINT_VERSION }}

      - name: Restore DerivedData
        # Keyed per commit and restored from the newest prefix match.
        # actions/cache only saves on a key miss, so a config-hash key
        # was saved once and then restored ever staler; main pushes now
        # save a fresh copy (see "Save DerivedData" below).
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-data-${{ runner.os }}-${{ github.sha }}
          restore-keys: derived-data-${{ runner.os }}-

      - name: Install XcodeGen and SwiftLint
        run: |
          TOOLS="$HOME/.ci-tools"
          if [ ! -x "$TOOLS/xcodegen/bin/xcodegen" ]; then
            mkdir -p "$TOOLS"
            curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
              "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
            unzip -q -o "$RUNNER_TEMP/xcodegen.zip" -d "$TOOLS"
          fi
          if [ ! -x "$TOOLS/swiftlint/swiftlint" ]; then
            curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
              "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
            unzip -q -o "$RUNNER_TEMP/swiftlint.zip" -d "$TOOLS/swiftlint"
          fi
          echo "$TOOLS/xcodegen/bin" >> "$GITHUB_PATH"
          echo "$TOOLS/swiftlint" >> "$GITHUB_PATH"
          echo "XcodeGen $("$TOOLS/xcodegen/bin/xcodegen" --version), SwiftLint $("$TOOLS/swiftlint/swiftlint" version)"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Generate app icon (fallback)
        run: |
          ICON="Peptide/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          if [ -f "$ICON" ]; then
            echo "App icon already exists, skipping generation"
            exit 0
          fi
          python3 - << 'EOF'
          import struct, zlib, os

          def make_png(width, height, r, g, b):
              def chunk(name, data):
                  c = zlib.crc32(name + data) & 0xffffffff
                  return struct.pack('>I', len(data)) + name + data + struct.pack('>I', c)
              ihdr = struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0)
              scanline = b'\x00' + bytes([r, g, b]) * width
              raw = scanline * height
              idat = zlib.compress(raw)
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', idat) + chunk(b'IEND', b'')

          out = 'Peptide/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
          os.makedirs(os.path.dirname(out), exist_ok=True)
          with open(out, 'wb') as f:
              f.write(make_png(1024, 1024, 0, 102, 204))
          print(f"Generated {out}")
          EOF

      - name: Validate resource files
        run: |
          # A malformed Info.plist, entitlements file or privacy manifest is
          # an App Store rejection, so every tracked one is linted, across
          # all four targets. plutil -lint exits non-zero on a parse error.
          git ls-files -z '*.plist' '*.entitlements' '*.xcprivacy' | xargs -0 -n1 plutil -lint
          # String catalogs and the StoreKit config are JSON; validate via
          # python rather than plutil (plutil's auto-detection on these
          # extensions is unreliable).
          python3 -c "import json; json.load(open('Peptide/Resources/Localizable.xcstrings'))"
          python3 -c "import json; json.load(open('Peptide/Resources/Products.storekit'))"

      - name: Build app
        # Gates the PR on the iOS app compiling, so an app build error
        # is reported on its own before the Unit Tests step compiles and
        # runs the test targets. `-scheme` + `-destination` (not
        # `-target -sdk`) is required so the embedded watchOS app builds
        # against the watch SDK rather than having iphonesimulator
        # forced on it.
        run: |
          # `generic/platform=iOS Simulator` compiles without requiring any
          # particular simulator to exist. Naming iPhone 16 made this step
          # depend on the runner image happening to ship that device — and
          # it does not always: test-compile failed on exactly this line
          # with "Unable to find a device matching the provided destination
          # specifier" while build-check, on a different runner in the same
          # workflow, found one. A gating job must not be a coin flip.
          #
          # The log feeds the concurrency-warning count below; pipefail
          # keeps a compile error failing this step through the tee.
          set -o pipefail
          xcodebuild build \
            -project Peptide.xcodeproj \
            -scheme Peptide \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build-output.log

      - name: Count concurrency warnings
        # Swift 5 mode with targeted strict concurrency downgrades
        # data-race diagnostics to warnings, so nothing else surfaces
        # them. Ratcheted against scripts/ci-baselines.json: a PR may not
        # add any (audits A553, B345).
        run: |
          if [ ! -f build-output.log ]; then
            echo "No build-output.log — Build app step did not run."
            exit 0
          fi
          COUNT=$(grep -E 'warning: .*(Sendable|actor-isolated|data race|nonisolated)' build-output.log | sort -u | wc -l | tr -d ' ' || true)
          echo "Swift concurrency warnings (unique): ${COUNT}"
          {
            echo "## Swift concurrency warnings"
            echo ""
            echo "Unique warnings mentioning Sendable, actor-isolated, data race or nonisolated in the Debug app build: **${COUNT}**"
          } >> "$GITHUB_STEP_SUMMARY" || true
          python3 scripts/ratchet.py concurrency_warnings "$COUNT"

      - name: Build app (Release)
        # Debug alone never sees a symbol referenced outside its
        # `#if DEBUG` guard or an optimizer-only failure. Those would
        # otherwise surface first in the TestFlight lane.
        run: |
          xcodebuild build \
            -project Peptide.xcodeproj \
            -scheme Peptide \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Lint
        # `force_unwrapping` and `implicitly_unwrapped_optional` are
        # already configured at error severity, so they gate every PR
        # without --strict. --strict additionally promotes every
        # *warning* to a fatal error, which currently surfaces ~108
        # pre-existing formatting violations (comma/colon/brace
        # spacing, vertical whitespace, redundant let _, etc.) across
        # files unrelated to this PR. Those should be cleaned up in
        # a dedicated `swiftlint --fix` pass and a focused
        # follow-up PR — not jammed into a feature PR. Re-add
        # --strict in that same commit.
        run: swiftlint lint --reporter github-actions-logging

      - name: Unit Tests
        # Gating, as of 2026-08-08. This step spent its first outings on
        # `continue-on-error` because the suite had not run in months and
        # a failure was information rather than a verdict. Those runs
        # found five genuinely broken tests — three asserting things the
        # code could not produce, one reporting a real decay bug, one
        # missing the store isolation its ten sibling suites had. With
        # those fixed the suite reached 1039 tests / 0 failures on
        # dd5b054, so the flag has done its job and is gone.
        #
        # It should not come back. While it was set, `build-check`
        # reported success with `** TEST FAILED **` sitting in its log,
        # and a green badge meant nothing — the failures were only
        # visible to someone who opened the annotations. If the suite
        # goes red, fix the test or fix the code; muting the signal
        # again just recreates months of invisible rot.
        run: |
          # Resolve whatever iPhone this runner actually has rather than
          # naming one. A hardcoded `name:iPhone 16` is why test-compile
          # died with "Unable to find a device matching the provided
          # destination specifier" while a sibling job on another runner
          # found one — the image's simulator list is not guaranteed.
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; ids=[x['udid'] for r in d.values() for x in r if 'iPhone' in x.get('name','')]; print(ids[0] if ids else '')")
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No iPhone simulator available on this runner image."
            exit 1
          fi
          echo "Running unit tests on simulator $DEVICE_ID"

          set -o pipefail
          xcodebuild test \
            -project Peptide.xcodeproj \
            -scheme Peptide \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:PeptideTests \
            -resultBundlePath UnitTestResults.xcresult \
            2>&1 | tee test-output.log

      - name: Save DerivedData
        # Only main pushes save, so every main build refreshes the cache
        # PRs restore from, and PR runs cannot evict it with their own.
        if: "!cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'"
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-data-${{ runner.os }}-${{ github.sha }}

      - name: Coverage report
        # Ratcheted against scripts/ci-baselines.json: a PR may not lower
        # total line coverage (audit B345).
        if: always()
        run: |
          if [ ! -d UnitTestResults.xcresult ]; then
            echo "No xcresult bundle — skipping coverage."
            exit 0
          fi

          # xccov is the supported, version-stable interface for coverage data.
          if ! xcrun xccov view --report --json UnitTestResults.xcresult > coverage.json 2>/dev/null; then
            echo "xccov could not read coverage from the bundle."
            exit 0
          fi

          # Use jq (preinstalled on macOS runners) so we don't need a python
          # heredoc that's brittle under YAML/bash quoting.
          PCT=$(jq -r '(.lineCoverage // 0) * 100 | . * 10 | floor / 10' coverage.json 2>/dev/null || echo "0")

          echo "Total line coverage: ${PCT}%"
          {
            echo "## Code coverage"
            echo ""
            echo "Total line coverage: **${PCT}%**"
            echo ""
            echo "Per-target breakdown:"
            echo ""
            echo "| Target | Coverage |"
            echo "|--------|----------|"
            jq -r '.targets[]? | "| \(.name) | \((.lineCoverage // 0) * 100 | . * 10 | floor / 10)% |"' coverage.json 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

          python3 scripts/ratchet.py line_coverage_pct "$PCT"

      - name: Print test failures
        # `always()`, not `failure()`. The Unit Tests step now fails the
        # job on a red suite, so `failure()` would mostly work — but this
        # also has to run when an earlier step blew up, and grepping the
        # log is what turns "Executed N tests, with M failures" into
        # inline PR annotations rather than something you find by
        # scrolling a 9,000-line log.
        if: always()
        run: |
          if [ ! -f test-output.log ]; then
            echo "No test-output.log to inspect — Unit Tests step was skipped or did not produce output."
            exit 0
          fi
          echo "=== FAILED TESTS ==="
          grep -iE '(Test Case .* failed|error:|fatal error|Assertion|FAILED|Executed)' test-output.log | tail -60 || true
          echo ""
          echo "=== EMITTING AS ANNOTATIONS ==="
          grep -E 'Test Case .* failed' test-output.log | while IFS= read -r line; do
            echo "::error::$line"
          done || true
          grep -E '(Executed .* with .* failure)' test-output.log | while IFS= read -r line; do
            echo "::error::$line"
          done || true

      - name: UI Tests
        # Cost gate: opt-in via the `run-ui-tests` label, because UI
        # tests add ~3–5 min of macOS time to every run. Label the PR
        # with `run-ui-tests` to exercise them on the next push. Uses
        # `xcodebuild test`, so this path does its own incremental build
        # of whatever the UI test target needs.
        #
        # The nightly run has no labels, so it opts in by event instead:
        # without it the accessibility audits and the paywall
        # Close-hittable check never ran unless someone remembered the
        # label (audit B126). Nightly runs the PeptideUITests class only;
        # ScreenshotTests stays label-gated because it costs ~14 min.
        if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-ui-tests')
        env:
          UI_TEST_SCOPE: ${{ github.event_name == 'schedule' && 'PeptideUITests/PeptideUITests' || 'PeptideUITests' }}
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; ids=[x['udid'] for r in d.values() for x in r if 'iPhone' in x.get('name','')]; print(ids[0] if ids else '')")
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No iPhone simulator available on this runner image."
            exit 1
          fi
          xcodebuild test \
            -project Peptide.xcodeproj \
            -scheme Peptide \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:"$UI_TEST_SCOPE" \
            -resultBundlePath UITestResults.xcresult

      - name: Upload test results
        # `always()` because a red suite now fails the job, and without
        # this the xcresult bundle would stop uploading exactly when
        # someone needs it to diagnose the failure.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            UnitTestResults.xcresult
            UITestResults.xcresult
            test-output.log
          retention-days: 7
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────── Proxy job
  #
  # Lightweight syntax + lint pass for the standalone Vercel meal-scan
  # proxy under server/. Runs in seconds on ubuntu-latest so a one-line
  # change to the proxy doesn't burn a 15-min macOS runner; the iOS
  # build is skipped via the filter job above.
  proxy-checks:
    # Runs unconditionally. The proxy job is <30 s on Ubuntu, so the
    # cost of running it on every PR (including iOS-only ones) is
    # negligible (~$0.003) and keeps the aggregator simple.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Guard against committed proxy secrets
        # ios-testflight injects every *_SECRET key into Info.plist at
        # build time only. No committed plist may contain them — fail
        # the PR if one does, so a local inject-then-commit can't leak a
        # live proxy secret into git history.
        run: |
          if git grep -lE 'MEAL_SCANNER_SECRET|AI_RESEARCH_SECRET|WEEKLY_SUMMARY_SECRET|APP_ATTEST_SECRET|APPLE_REVOKE_SECRET' \
            -- '*.plist'; then
            echo "::error::Proxy secret keys found in a committed plist — remove before merging."
            exit 1
          fi
          echo "OK: no proxy secret keys committed."

      - name: Guard against committed Anthropic keys
        # The proxy holds the Anthropic key so the binary never ships
        # one. A real key is 90+ characters; the docs' placeholders
        # (`sk-ant-your-key-here`, `sk-ant-...`) are too short to match.
        run: |
          if git grep -nE 'sk-ant-[A-Za-z0-9_-]{20,}'; then
            echo "::error::An Anthropic API key is committed — remove it and rotate the key."
            exit 1
          fi
          echo "OK: no Anthropic keys committed."

      - name: Design system check
        # SwiftLint covers Swift-level problems; this covers design-system
        # ones — raw colour literals that skip light mode, fixed font sizes
        # that skip Dynamic Type, glass surfaces that stack two materials,
        # sub-44pt tap targets, off-grid spacing. Errors fail the build;
        # warnings are printed for review.
        run: python3 scripts/design-lint.py --all

      - name: Checker self-tests
        # design-lint.py once went blind on a rule (rule_glow) without
        # anything noticing. Each checker's own unit suite runs here so a
        # checker regression fails the PR, not a later human review.
        run: |
          python3 scripts/test_design_lint.py
          python3 scripts/test_copy_claims.py
          python3 scripts/test_contrast_check.py
          python3 scripts/test_store_metadata.py
          python3 scripts/test_ratchet.py

      - name: Copy claims vs source
        # Pins numeric marketing copy (exercise counts, compound counts,
        # tier tables), purpose strings vs API use, and entitlements vs
        # code. Previously local-only via scripts/check.sh.
        run: python3 scripts/check-copy-claims.py

      - name: App Store metadata check
        # Guideline 3.1.2: an app selling auto-renewable subscriptions must
        # link the Terms of Use (EULA) from its metadata, and the App
        # Description is the only place the standard EULA link can live —
        # App Store Connect has no field for it. Build 1.2.0 (135) was
        # rejected for exactly that. Pinned here so a copy edit cannot drop
        # the links again.
        run: python3 scripts/check-store-metadata.py

      - name: Localization gate
        # A missing or broken translation is not a build error: a missing
        # key silently renders English, a translation with the wrong
        # format specifiers crashes or prints garbage, in that language
        # only. Holds every shipped language to 80% of the UI and every
        # translation to its key's specifiers, and every UI sentence to a
        # catalog entry: coverage is 100% today, so a PR may not lower it.
        run: python3 scripts/check-localization.py --min-coverage 100

      - name: Colour contrast check
        # The design tokens ship two schemes, and light mode has never been
        # rendered on a device. Contrast is the part of "is it legible" that
        # can be settled arithmetically, so every ink/surface pair is held
        # to WCAG 2.1 AA here rather than waiting for a screenshot.
        run: python3 scripts/contrast-check.py

      - name: Verify bundled peptide dataset integrity
        # PeptideDatabase falls back to a tiny MockPeptides set if
        # peptides.json is missing or corrupt — and in release builds
        # that fallback is silent (assertionFailure is a no-op). Fail
        # the build here instead so a dropped/truncated dataset can
        # never ship.
        run: |
          python3 - <<'PY'
          import json, sys
          with open('Peptide/Resources/peptides.json') as f:
              data = json.load(f)
          entries = data.get('peptides', []) if isinstance(data, dict) else data
          count = len(entries)
          print(f'peptides.json entries: {count}')
          if count != 208:
              print(f'::error::peptides.json has {count} entries, expected 208')
              sys.exit(1)
          PY

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Validate package.json
        working-directory: server
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"

      - name: Syntax check the proxy
        # `node --check` parses the source and exits non-zero on any
        # syntax error without executing the module. Covers stray
        # commas, missing brackets, top-level await typos, etc.
        working-directory: server
        run: for f in api/*.js api/_lib/*.js; do node --check "$f" || exit 1; done

      - name: Run proxy test suite
        # The auth / rate-limit / App Attest / sanitisation logic guarding
        # the Anthropic key has a full node:test suite that
        # until now only ran locally via scripts/check.sh. Zero deps —
        # node --test discovers server/test/ on the stock runner.
        working-directory: server
        run: node --test

      - name: Sanity-check exports
        # The Vercel runtime expects `default export` to be a function.
        # Catch regressions where a refactor turns it into an object or
        # forgets the export entirely.
        working-directory: server
        run: |
          node --input-type=module -e "
            import('./api/meal-scan.js').then(mod => {
              if (typeof mod.default !== 'function') {
                console.error('FATAL: api/meal-scan.js default export is not a function');
                process.exit(1);
              }
              console.log('OK: default export is a function');
            }).catch(err => {
              console.error('Import failed:', err.message);
              process.exit(1);
            });
          "

  # ───────────────────────────────────────────────────────── Aggregate
  #
  # A no-op job that depends on all real jobs. Lets the branch-protection
  # "require status check" rule point at a single name (pr-checks)
  # regardless of which jobs ran or were filtered out.
  pr-checks:
    needs: [filter, build-check, proxy-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate result
        run: |
          FILTER_RESULT="${{ needs.filter.result }}"
          BUILD_RESULT="${{ needs.build-check.result }}"
          PROXY_RESULT="${{ needs.proxy-checks.result }}"
          echo "filter:       $FILTER_RESULT"
          echo "build-check:  $BUILD_RESULT"
          echo "proxy-checks: $PROXY_RESULT"

          # Pass if every job that *ran* succeeded. Jobs skipped by the
          # filter return 'skipped' which we treat as a pass — that's
          # the whole point of the filter. The filter job itself must
          # always succeed since it gates everything else.
          if [ "$FILTER_RESULT" != "success" ]; then
            echo "::error::filter job did not succeed ($FILTER_RESULT)."
            exit 1
          fi
          if [ "$BUILD_RESULT" = "failure" ] || [ "$PROXY_RESULT" = "failure" ]; then
            echo "::error::A required check failed."
            exit 1
          fi
          if [ "$BUILD_RESULT" = "cancelled" ] || [ "$PROXY_RESULT" = "cancelled" ]; then
            echo "::error::A required check was cancelled."
            exit 1
          fi
          echo "All ran checks succeeded (skipped jobs treated as pass)."

name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Cellar/xcodegen
            /opt/homebrew/Cellar/xcodegen
          key: brew-xcodegen-${{ runner.os }}-${{ runner.arch }}

      - name: Install XcodeGen
        run: |
          if command -v xcodegen &> /dev/null; then
            echo "XcodeGen already available: $(xcodegen --version)"
          else
            brew install xcodegen 2>&1 || true
            brew link --overwrite xcodegen 2>/dev/null || true
          fi
          if ! command -v xcodegen &> /dev/null; then
            echo "FATAL: xcodegen not on PATH after install"
            ls -la /opt/homebrew/Cellar/xcodegen/ 2>/dev/null || ls -la /usr/local/Cellar/xcodegen/ 2>/dev/null || echo "No xcodegen in Cellar"
            exit 1
          fi
          echo "XcodeGen ready: $(xcodegen --version)"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Generate app icon
        run: |
          python3 - << 'EOF'
          import struct, zlib, os

          def make_png(width, height, r, g, b):
              def chunk(name, data):
                  c = zlib.crc32(name + data) & 0xffffffff
                  return struct.pack('>I', len(data)) + name + data + struct.pack('>I', c)
              ihdr = struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0)
              scanline = b'\x00' + bytes([r, g, b]) * width
              raw = scanline * height
              idat = zlib.compress(raw)
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', idat) + chunk(b'IEND', b'')

          out = 'Peptide/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
          os.makedirs(os.path.dirname(out), exist_ok=True)
          with open(out, 'wb') as f:
              f.write(make_png(1024, 1024, 0, 102, 204))
          print(f"Generated {out}")
          EOF

      - name: Build
        run: |
          xcodebuild build \
            -project Peptide.xcodeproj \
            -scheme Peptide \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Install SwiftLint
        run: |
          if command -v swiftlint &> /dev/null; then
            echo "SwiftLint already available"
          else
            brew install swiftlint 2>&1 || true
          fi

      - name: Lint
        run: swiftlint lint --reporter github-actions-logging || true

      - name: Test
        run: |
          xcodebuild test \
            -project Peptide.xcodeproj \
            -scheme Peptide \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult || true

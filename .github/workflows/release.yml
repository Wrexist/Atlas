name: Release Version Bump
on:
  push:
    tags: ['v*']

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update version in project.yml
        run: |
          sed -i "s/MARKETING_VERSION: \"[^\"]*\"/MARKETING_VERSION: \"${{ steps.version.outputs.VERSION }}\"/" project.yml
          echo "Updated MARKETING_VERSION to ${{ steps.version.outputs.VERSION }}"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add project.yml
          git commit -m "chore: bump version to ${{ steps.version.outputs.VERSION }}" || echo "No changes to commit"
          git push origin HEAD:main

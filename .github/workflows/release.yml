name: Release Version Bump
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract and validate version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          # App Store Connect only accepts up to three dot-separated
          # integers, so a pre-release suffix like 1.3.0-beta.1 is refused.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "FATAL: Invalid version format: $VERSION (expected 1.2 or 1.2.3)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update version in project.yml
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # Anchored to indented settings lines so the auto-version
          # contract comment at the top of project.yml is left alone.
          sed -i -E 's/^([[:space:]]+MARKETING_VERSION: )"[^"]*"/\1"'"$VERSION"'"/' project.yml
          echo "Updated MARKETING_VERSION to ${VERSION}"
          python3 - <<'PY'
          import sys
          try:
              import yaml
          except ImportError:
              sys.exit(0)  # pyyaml not available, skip validation
          with open("project.yml") as f:
              yaml.safe_load(f)
          print("project.yml YAML syntax OK")
          PY

      - name: Open version bump PR
        # Through a PR, not a push to main, so the bump goes through the
        # same checks as every other change. A PR opened with
        # GITHUB_TOKEN does not trigger workflows, so close and reopen
        # it to start PR Checks.
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet project.yml; then
            echo "project.yml already at ${VERSION}; nothing to bump."
            exit 0
          fi
          BRANCH="chore/bump-version-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "Bump marketing version to ${VERSION}"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Bump marketing version to ${VERSION}" \
            --body "Sets MARKETING_VERSION in project.yml to match tag v${VERSION}. Close and reopen this PR to run PR Checks."

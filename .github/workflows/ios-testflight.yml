name: iOS TestFlight (Fastlane Match)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT:        Peptide.xcodeproj
  SCHEME:         Peptide
  CONFIGURATION:  Release
  ARCHIVE_PATH:   build/Peptide.xcarchive

jobs:
  build:
    name: Build + upload
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets (Match + ASC)
        env:
          APPLE_TEAM_ID:        ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID:           ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:        ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8:           ${{ secrets.ASC_KEY_P8 }}
          MATCH_GIT_URL:        ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD:       ${{ secrets.MATCH_PASSWORD }}
          MATCH_SSH_PRIVATE_KEY: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}
        run: |
          set -u
          MISSING=0
          check() {
            if [ -z "${2:-}" ]; then
              echo "FATAL: secret '$1' is empty or unset"
              MISSING=1
            else
              echo "OK: $1 present (${#2} chars)"
            fi
          }
          check APPLE_TEAM_ID  "$APPLE_TEAM_ID"
          check ASC_KEY_ID     "$ASC_KEY_ID"
          check ASC_ISSUER_ID  "$ASC_ISSUER_ID"
          check ASC_KEY_P8     "$ASC_KEY_P8"
          check MATCH_GIT_URL  "$MATCH_GIT_URL"
          check MATCH_PASSWORD "$MATCH_PASSWORD"
          check MATCH_SSH_PRIVATE_KEY "$MATCH_SSH_PRIVATE_KEY"
          if [ "${#APPLE_TEAM_ID}" -ne 10 ]; then
            echo "WARN: APPLE_TEAM_ID is ${#APPLE_TEAM_ID} chars (expected 10)"
          fi
          if [ "${#ASC_KEY_ID}" -ne 10 ]; then
            echo "WARN: ASC_KEY_ID is ${#ASC_KEY_ID} chars (expected 10)"
          fi
          if [ "${#ASC_ISSUER_ID}" -ne 36 ]; then
            echo "WARN: ASC_ISSUER_ID is ${#ASC_ISSUER_ID} chars (expected 36 UUID)"
          fi
          [ "$MISSING" -eq 0 ] || exit 1

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Ruby + Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true

      - name: Setup SSH for match repo
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}

      - name: Trust GitHub SSH host key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct, zlib, os, pathlib
          def make_png(w, h, r, g, b):
              def chunk(name, data):
                  c = zlib.crc32(name + data) & 0xffffffff
                  return struct.pack('>I', len(data)) + name + data + struct.pack('>I', c)
              ihdr = struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)
              raw  = (b'\x00' + bytes([r, g, b]) * w) * h
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
          for path, rgb in [
              ('Peptide/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png', (0, 102, 204)),
              ('PeptideWatch/Assets.xcassets/AppIcon.appiconset/AppIcon.png',     (0, 102, 204)),
          ]:
              if not os.path.exists(path):
                  os.makedirs(os.path.dirname(path), exist_ok=True)
                  pathlib.Path(path).write_bytes(make_png(1024, 1024, *rgb))
                  print(f'generated fallback icon at {path}')
          PY
          xcodegen generate
          test -d "$PROJECT" || { echo "FATAL: xcodegen did not produce $PROJECT"; exit 1; }

      - name: Stamp build number (all bundles)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          PLIST="Peptide/Resources/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"
          WPLIST="PeptideWidgets/Info.plist"
          if [ -f "$WPLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$WPLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" "$WPLIST"
          fi

      - name: Write App Store Connect API key to disk (JSON + .p8)
        env:
          ASC_KEY_P8:    ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p fastlane
          printf '%s' "$ASC_KEY_P8" | sed 's/\\n/\n/g' > fastlane/AuthKey.p8
          chmod 600 fastlane/AuthKey.p8
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("fastlane/asc_api_key.json")
          p.write_text(json.dumps({
              "key_id": os.environ["ASC_KEY_ID"],
              "issuer_id": os.environ["ASC_ISSUER_ID"],
              "key": os.environ["ASC_KEY_P8"].replace("\\\\n", "\\n"),
              "in_house": False,
          }))
          PY
          chmod 600 fastlane/asc_api_key.json
          echo "Wrote fastlane/asc_api_key.json ($(wc -c < fastlane/asc_api_key.json) bytes)"

      - name: Fastlane (match readonly + build + upload)
        env:
          APPLE_TEAM_ID:        ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID:           ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:        ${{ secrets.ASC_ISSUER_ID }}
          MATCH_GIT_URL:        ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD:       ${{ secrets.MATCH_PASSWORD }}
          ASC_API_KEY_PATH:     fastlane/asc_api_key.json
          BUILD_NUMBER:         ${{ github.run_number }}
        run: |
          set -euo pipefail
          bundle exec fastlane ios beta --verbose

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-fastlane-${{ github.run_number }}
          path: |
            fastlane/report.xml
            fastlane/README.md
          if-no-files-found: warn
          retention-days: 14

name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'Marketing version, e.g. 1.0.5. Leave blank to auto-generate 1.0.<run_number> so every upload is unique.'
        required: false
        type: string
        default: ''

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}

      - name: Trust GitHub SSH host key
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Resolve marketing version (input or auto 1.0.<run_number>)
        env:
          INPUT_VERSION: ${{ github.event.inputs.marketing_version }}
          BUILD: ${{ github.run_number }}
        run: |
          if [ -z "$INPUT_VERSION" ]; then
            NEW_VERSION="1.0.$BUILD"
            echo "No marketing_version input — defaulting to $NEW_VERSION so the build is unique."
          else
            NEW_VERSION="$INPUT_VERSION"
            echo "Using marketing_version input: $NEW_VERSION"
          fi
          sed -i '' "s/MARKETING_VERSION: \"[^\"]*\"/MARKETING_VERSION: \"$NEW_VERSION\"/g" project.yml
          echo "MARKETING_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION lines after override:"
          grep MARKETING_VERSION project.yml

      - name: Sync CURRENT_PROJECT_VERSION across all targets to run_number
        env:
          BUILD: ${{ github.run_number }}
        run: |
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"[^\"]*\"/CURRENT_PROJECT_VERSION: \"$BUILD\"/g" project.yml
          echo "CURRENT_PROJECT_VERSION lines after sync:"
          grep CURRENT_PROJECT_VERSION project.yml

      - name: Generate fallback app icons if missing
        run: |
          python3 - <<'PY'
          import struct, zlib, os, pathlib
          def make_png(w, h, r, g, b):
              def chunk(name, data):
                  c = zlib.crc32(name + data) & 0xffffffff
                  return struct.pack('>I', len(data)) + name + data + struct.pack('>I', c)
              ihdr = struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)
              raw  = (b'\x00' + bytes([r, g, b]) * w) * h
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
          for path, rgb in [
              ('Peptide/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png', (0, 102, 204)),
              ('PeptideWatch/Assets.xcassets/AppIcon.appiconset/AppIcon.png',     (0, 102, 204)),
          ]:
              if not os.path.exists(path):
                  os.makedirs(os.path.dirname(path), exist_ok=True)
                  pathlib.Path(path).write_bytes(make_png(1024, 1024, *rgb))
                  print(f'generated fallback icon at {path}')
              else:
                  print(f'icon exists at {path}, leaving alone')
          PY

      - name: Install XcodeGen and generate Xcode project
        run: |
          brew install xcodegen || true
          xcodegen generate

      - name: Stamp version + build number into bundle plists
        env:
          BUILD: ${{ github.run_number }}
          MARKETING_VERSION: ${{ env.MARKETING_VERSION }}
        run: |
          # Belt-and-suspenders: after xcodegen has materialized the
          # Info.plist files, force the version keys to literal values
          # so xcodebuild can't ship a stale "1.0" if the
          # $(MARKETING_VERSION) substitution fails for any reason.
          for PLIST in \
            Peptide/Resources/Info.plist \
            PeptideWidgets/Info.plist \
            PeptideWatchWidgets/Info.plist; do
            if [ -f "$PLIST" ]; then
              /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST" 2>/dev/null \
                || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD" "$PLIST"
              /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING_VERSION" "$PLIST" 2>/dev/null \
                || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $MARKETING_VERSION" "$PLIST"
              echo "Stamped $PLIST → short=$MARKETING_VERSION build=$BUILD"
            fi
          done

      - name: Inject AI proxy endpoints + secrets into Info.plist
        env:
          MEAL_SCANNER_ENDPOINT: ${{ secrets.MEAL_SCANNER_ENDPOINT }}
          MEAL_SCANNER_SECRET:   ${{ secrets.MEAL_SCANNER_SECRET }}
          AI_RESEARCH_ENDPOINT:  ${{ secrets.AI_RESEARCH_ENDPOINT }}
          AI_RESEARCH_SECRET:    ${{ secrets.AI_RESEARCH_SECRET }}
        run: |
          PLIST=Peptide/Resources/Info.plist
          # Fail loudly rather than ship a build with the AI features
          # silently disabled — a missing secret here means GitHub repo
          # secrets weren't configured. Fix the secrets, re-run the
          # workflow.
          for VAR in MEAL_SCANNER_ENDPOINT MEAL_SCANNER_SECRET AI_RESEARCH_ENDPOINT AI_RESEARCH_SECRET; do
            if [ -z "${!VAR}" ]; then
              echo "::error::Repository secret $VAR is empty or missing. Add it under Settings → Secrets and variables → Actions."
              exit 1
            fi
          done
          for KEY in MEAL_SCANNER_ENDPOINT MEAL_SCANNER_SECRET AI_RESEARCH_ENDPOINT AI_RESEARCH_SECRET; do
            VALUE="${!KEY}"
            /usr/libexec/PlistBuddy -c "Set :$KEY $VALUE" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :$KEY string $VALUE" "$PLIST"
          done
          echo "Info.plist now declares the AI proxy keys (values hidden)."

      - name: Deploy to TestFlight
        env:
          ASC_KEY_ID:     ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:  ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8:     ${{ secrets.ASC_KEY_P8 }}
          MATCH_GIT_URL:  ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane ios beta

name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'Marketing version, e.g. 1.1.5. Leave blank to auto-generate 1.1.<run_number> so every upload is unique.'
        required: false
        type: string
        default: ''

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Pin to macos-15 (Xcode 16) so TestFlight builds use the same
    # toolchain as pr-checks. `macos-latest` drifts whenever GitHub
    # rotates the default image and produces builds that diverge from
    # the PR checks that passed on the same SHA.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          # Do NOT enable bundler-cache here. It caches vendor/bundle via
          # actions/cache, whose restore-keys fall back to a prefix that
          # ignores the Gemfile.lock hash — so when the hosted runner rotates
          # its bundler/Ruby toolchain, the previous bundle is restored with
          # native-extension gems (json, nkf, digest-crc, bigdecimal) compiled
          # for the old toolchain. Bundler then skips them as "missing
          # extensions" and `bundle exec fastlane` dies before the build even
          # starts. This lane runs rarely and by hand, so installing clean
          # every time is cheap and immune to that cache poisoning.
          bundler-cache: false

      - name: Install Ruby gems (clean — no poisoned cache)
        run: bundle install --jobs 4 --retry 3

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}

      - name: Trust GitHub SSH host key
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts

      # ─── Auto-version pipeline ────────────────────────────────────
      #
      # Single source of truth: the workflow input, OR 1.1.<run_number>
      # when the input is blank. From here every layer is forced to
      # the same value:
      #   1. sed → project.yml MARKETING_VERSION (every target)
      #   2. sed → project.yml CURRENT_PROJECT_VERSION (every target)
      #   3. xcodegen reads those settings + writes Info.plist files
      #      whose CFBundleShortVersionString is $(MARKETING_VERSION)
      #   4. PlistBuddy stamps the resolved literal into every iOS /
      #      watch Info.plist on disk (belt-and-suspenders, in case
      #      Xcode's substitution misbehaves on any sub-bundle)
      #   5. Fastfile passes MARKETING_VERSION / CURRENT_PROJECT_VERSION
      #      through xcargs to xcodebuild — last-resort pin
      #
      # If you add a new target, the only thing you have to do is set
      # MARKETING_VERSION + CURRENT_PROJECT_VERSION in its
      # `settings.base` block (and CFBundleShortVersionString /
      # CFBundleVersion in `info.properties` if it has an Info.plist).
      # The sed + glob steps below pick up the rest automatically.
      - name: Resolve marketing version (input or auto 1.1.<run_number>)
        env:
          INPUT_VERSION: ${{ github.event.inputs.marketing_version }}
          BUILD: ${{ github.run_number }}
        run: |
          if [ -z "$INPUT_VERSION" ]; then
            # Auto line lives on 1.1.x: run_number only ever increases, so
            # 1.1.<run_number> is always > the previous auto build and > the
            # stranded 1.0.x history. Once you bump to an explicit higher
            # minor (e.g. 1.2.0), keep passing it — a blank input would drop
            # back to 1.1.<run_number> and the regression guard would reject it.
            NEW_VERSION="1.1.$BUILD"
            echo "No marketing_version input — defaulting to $NEW_VERSION so the build is unique."
          else
            NEW_VERSION="$INPUT_VERSION"
            echo "Using marketing_version input: $NEW_VERSION"
          fi

          # Apple accepts only numeric-dot strings: MAJOR.MINOR[.PATCH].
          # Catch typos like "v1.0.1" or "1,0,1" before they cost a build.
          if ! printf '%s' "$NEW_VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,2}$'; then
            echo "::error::Marketing version '$NEW_VERSION' is not a valid MAJOR.MINOR[.PATCH] string."
            exit 1
          fi

          # Match double-quoted, single-quoted, and unquoted forms so a
          # future YAML reformatting can't silently bypass the rewrite.
          sed -i '' -E "s/(MARKETING_VERSION:[[:space:]]*)[\"']?[^\"'[:space:]]+[\"']?/\1\"$NEW_VERSION\"/g" project.yml

          # Hard-verify every MARKETING_VERSION line now equals NEW_VERSION.
          # A single unmatched line means a sub-bundle will ship the wrong
          # version and Apple will reject the upload — fail here instead.
          BAD=$(grep -E '^[[:space:]]*MARKETING_VERSION:' project.yml | grep -v "\"$NEW_VERSION\"" || true)
          if [ -n "$BAD" ]; then
            echo "::error::Some MARKETING_VERSION lines did not get rewritten to $NEW_VERSION:"
            echo "$BAD"
            exit 1
          fi

          echo "MARKETING_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION lines after override:"
          grep -n MARKETING_VERSION project.yml

      - name: Sync CURRENT_PROJECT_VERSION across all targets to run_number
        env:
          BUILD: ${{ github.run_number }}
        run: |
          sed -i '' -E "s/(CURRENT_PROJECT_VERSION:[[:space:]]*)[\"']?[^\"'[:space:]]+[\"']?/\1\"$BUILD\"/g" project.yml

          BAD=$(grep -E '^[[:space:]]*CURRENT_PROJECT_VERSION:' project.yml | grep -v "\"$BUILD\"" || true)
          if [ -n "$BAD" ]; then
            echo "::error::Some CURRENT_PROJECT_VERSION lines did not get rewritten to $BUILD:"
            echo "$BAD"
            exit 1
          fi

          echo "CURRENT_PROJECT_VERSION lines after sync:"
          grep -n CURRENT_PROJECT_VERSION project.yml

      - name: Generate fallback app icons if missing
        run: |
          python3 - <<'PY'
          import struct, zlib, os, pathlib
          def make_png(w, h, r, g, b):
              def chunk(name, data):
                  c = zlib.crc32(name + data) & 0xffffffff
                  return struct.pack('>I', len(data)) + name + data + struct.pack('>I', c)
              ihdr = struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)
              raw  = (b'\x00' + bytes([r, g, b]) * w) * h
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
          for path, rgb in [
              ('Peptide/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png', (0, 102, 204)),
              ('PeptideWatch/Assets.xcassets/AppIcon.appiconset/AppIcon.png',     (0, 102, 204)),
          ]:
              if not os.path.exists(path):
                  os.makedirs(os.path.dirname(path), exist_ok=True)
                  pathlib.Path(path).write_bytes(make_png(1024, 1024, *rgb))
                  print(f'generated fallback icon at {path}')
              else:
                  print(f'icon exists at {path}, leaving alone')
          PY

      - name: Install XcodeGen and generate Xcode project
        run: |
          # `|| true` previously masked brew failures and the next line
          # would die with "xcodegen: command not found". Install, ensure
          # the brew bin is on PATH for this step, then verify before
          # invoking — fail loud with a clear message if it isn't there.
          if ! command -v xcodegen &>/dev/null; then
            brew install xcodegen || brew reinstall xcodegen
          fi
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          export PATH="$(brew --prefix)/bin:$PATH"
          if ! command -v xcodegen &>/dev/null; then
            echo "::error::xcodegen still not on PATH after install"
            exit 1
          fi
          echo "XcodeGen ready: $(xcodegen --version)"
          xcodegen generate

      - name: Stamp version + build number into bundle plists
        env:
          BUILD: ${{ github.run_number }}
          MARKETING_VERSION: ${{ env.MARKETING_VERSION }}
        run: |
          # Belt-and-suspenders: after xcodegen has materialized the
          # Info.plist files, force the version keys to literal values
          # so xcodebuild can't ship a stale "1.0" if the
          # $(MARKETING_VERSION) substitution fails for any reason.
          #
          # Glob so a newly-added extension's Info.plist is stamped
          # automatically. The find expression covers every Info.plist
          # under the project's top-level target directories and
          # excludes the build/derived-data caches.
          # macOS runners ship bash 3.2 at /bin/bash, which predates the
          # `mapfile` builtin (bash 4+). Use a portable while-read loop
          # so this step works regardless of which bash GHA picks.
          PLISTS=()
          while IFS= read -r line; do
            PLISTS+=("$line")
          done < <(find . \
            \( -path './build' -o -path './DerivedData' -o -path './.build' -o -path './vendor' \) -prune -false \
            -o -name 'Info.plist' -type f -print | sort)

          if [ "${#PLISTS[@]}" -eq 0 ]; then
            echo "::error::No Info.plist files found to stamp — did xcodegen run?"
            exit 1
          fi

          for PLIST in "${PLISTS[@]}"; do
            # Skip plists that aren't bundle Info.plists (e.g. dSYM
            # Info.plists which legitimately have no version keys).
            if ! /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST" >/dev/null 2>&1; then
              echo "Skipping non-bundle plist: $PLIST"
              continue
            fi
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD" "$PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING_VERSION" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $MARKETING_VERSION" "$PLIST"
            echo "Stamped $PLIST → short=$MARKETING_VERSION build=$BUILD"
          done

          # Print what'll actually ship so log review can confirm at a
          # glance that no sub-bundle is stuck at "1.0".
          echo ""
          echo "=== Final CFBundleShortVersionString in every Info.plist ==="
          for PLIST in "${PLISTS[@]}"; do
            SHORT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" 2>/dev/null || echo "(missing)")
            BUILDV=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST" 2>/dev/null || echo "(missing)")
            echo "  $PLIST → short=$SHORT build=$BUILDV"
          done

      - name: Inject AI proxy endpoints + secrets into Info.plist
        env:
          MEAL_SCANNER_ENDPOINT: ${{ secrets.MEAL_SCANNER_ENDPOINT }}
          MEAL_SCANNER_SECRET:   ${{ secrets.MEAL_SCANNER_SECRET }}
          AI_RESEARCH_ENDPOINT:  ${{ secrets.AI_RESEARCH_ENDPOINT }}
          AI_RESEARCH_SECRET:    ${{ secrets.AI_RESEARCH_SECRET }}
        run: |
          PLIST=Peptide/Resources/Info.plist
          # Strip every flavor of whitespace (spaces, tabs, CR, LF) from
          # the start and end of each secret. A stray newline pasted into
          # a GitHub Actions secret would otherwise be written verbatim
          # into Info.plist; the proxy compares via timingSafeEqual on
          # equal length, so a single trailing \n is enough to produce
          # a 401 forever despite "looking right" in both dashboards.
          trim() {
            printf '%s' "$1" | awk '{ gsub(/^[[:space:]]+|[[:space:]]+$/, ""); print }'
          }
          MEAL_SCANNER_ENDPOINT=$(trim "$MEAL_SCANNER_ENDPOINT")
          MEAL_SCANNER_SECRET=$(trim "$MEAL_SCANNER_SECRET")
          AI_RESEARCH_ENDPOINT=$(trim "$AI_RESEARCH_ENDPOINT")
          AI_RESEARCH_SECRET=$(trim "$AI_RESEARCH_SECRET")

          # Fail loudly rather than ship a build with the AI features
          # silently disabled — a missing secret here means GitHub repo
          # secrets weren't configured. Fix the secrets, re-run the
          # workflow.
          for VAR in MEAL_SCANNER_ENDPOINT MEAL_SCANNER_SECRET AI_RESEARCH_ENDPOINT AI_RESEARCH_SECRET; do
            if [ -z "${!VAR}" ]; then
              echo "::error::Repository secret $VAR is empty or missing. Add it under Settings → Secrets and variables → Actions."
              exit 1
            fi
          done

          # Print byte-lengths (never the values) so a future paste-error
          # is easy to diagnose by comparing against Vercel's secret
          # length in the dashboard. The lengths themselves are not
          # sensitive — they're already implied by every 200/401 round
          # trip.
          for VAR in MEAL_SCANNER_ENDPOINT MEAL_SCANNER_SECRET AI_RESEARCH_ENDPOINT AI_RESEARCH_SECRET; do
            VALUE="${!VAR}"
            echo "  $VAR length: ${#VALUE} bytes"
          done

          for KEY in MEAL_SCANNER_ENDPOINT MEAL_SCANNER_SECRET AI_RESEARCH_ENDPOINT AI_RESEARCH_SECRET; do
            VALUE="${!KEY}"
            /usr/libexec/PlistBuddy -c "Set :$KEY $VALUE" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :$KEY string $VALUE" "$PLIST"
          done
          echo "Info.plist now declares the AI proxy keys (values hidden)."

      - name: Deploy to TestFlight
        env:
          ASC_KEY_ID:     ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:  ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8:     ${{ secrets.ASC_KEY_P8 }}
          MATCH_GIT_URL:  ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane ios beta

name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "Peptide/**"
      - "**.swift"
      - "**.xcodeproj/**"
      - "**.xcworkspace/**"
      - "**.entitlements"
      - ".github/workflows/ios-testflight.yml"

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT:           Peptide.xcodeproj
  SCHEME:            Peptide
  CONFIGURATION:     Release
  PRIMARY_BUNDLE:    com.peptidesai.app
  ICLOUD_CONTAINER:  iCloud.com.peptidesai.app
  ARCHIVE_PATH:      build/Peptide.xcarchive
  EXPORT_DIR:        build/export
  KEYCHAIN_NAME:     ci-signing.keychain-db
  ASC_KEY_PATH:      /tmp/AuthKey.p8

jobs:
  build:
    name: Archive + upload
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          APPLE_CERTIFICATE_BASE64:   ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID:              ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CONNECT_KEY_ID:       ${{ secrets.APPLE_CONNECT_KEY_ID }}
          APPLE_CONNECT_ISSUER_ID:    ${{ secrets.APPLE_CONNECT_ISSUER_ID }}
          APPLE_CONNECT_PRIVATE_KEY:  ${{ secrets.APPLE_CONNECT_PRIVATE_KEY }}
        run: |
          set -u
          MISSING=0
          check() {
            if [ -z "${2:-}" ]; then
              echo "FATAL: secret '$1' is empty or unset"
              MISSING=1
            else
              echo "OK: $1 present (${#2} chars)"
            fi
          }
          check APPLE_CERTIFICATE_BASE64   "$APPLE_CERTIFICATE_BASE64"
          check APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          check APPLE_TEAM_ID              "$APPLE_TEAM_ID"
          check APPLE_CONNECT_KEY_ID       "$APPLE_CONNECT_KEY_ID"
          check APPLE_CONNECT_ISSUER_ID    "$APPLE_CONNECT_ISSUER_ID"
          check APPLE_CONNECT_PRIVATE_KEY  "$APPLE_CONNECT_PRIVATE_KEY"
          # Length sanity. Apple key/team IDs are 10 chars, issuer is a UUID (36).
          if [ "${#APPLE_TEAM_ID}" -ne 10 ]; then
            echo "WARN: APPLE_TEAM_ID is ${#APPLE_TEAM_ID} chars (expected 10)"
          fi
          if [ "${#APPLE_CONNECT_KEY_ID}" -ne 10 ]; then
            echo "WARN: APPLE_CONNECT_KEY_ID is ${#APPLE_CONNECT_KEY_ID} chars (expected 10)"
          fi
          if [ "${#APPLE_CONNECT_ISSUER_ID}" -ne 36 ]; then
            echo "WARN: APPLE_CONNECT_ISSUER_ID is ${#APPLE_CONNECT_ISSUER_ID} chars (expected 36 UUID)"
          fi
          [ "$MISSING" -eq 0 ] || { echo "Set the missing secrets in repo Settings → Secrets → Actions."; exit 1; }

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          python3 --version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Stamp build number + verify Info.plist
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          PLIST="Peptide/Resources/Info.plist"
          # CFBundleVersion is currently $(CURRENT_PROJECT_VERSION) — replace it
          # with a concrete monotonic build number sourced from the GitHub run
          # counter so TestFlight doesn't reject duplicate uploads.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"
          STAMPED=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          echo "CFBundleVersion now = $STAMPED"
          if [ "$STAMPED" != "$BUILD_NUMBER" ]; then
            echo "FATAL: stamping failed; CFBundleVersion is '$STAMPED' but expected '$BUILD_NUMBER'"
            exit 1
          fi
          # Required UI keys (TestFlight rejects missing UILaunchScreen).
          /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations" "$PLIST" >/dev/null \
            || { echo "FATAL: UISupportedInterfaceOrientations missing"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :UILaunchScreen" "$PLIST" >/dev/null \
            || { echo "FATAL: UILaunchScreen missing"; exit 1; }
          echo "Info.plist required keys present."

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          # Project is gitignored; XcodeGen materialises it from project.yml.
          # Make sure the AppIcon asset exists or asset compilation will fail.
          ICON="Peptide/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          if [ ! -f "$ICON" ]; then
            python3 - <<'PY'
          import struct, zlib, os
          def make_png(w, h, r, g, b):
              def chunk(name, data):
                  c = zlib.crc32(name + data) & 0xffffffff
                  return struct.pack('>I', len(data)) + name + data + struct.pack('>I', c)
              ihdr = struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)
              raw  = (b'\x00' + bytes([r, g, b]) * w) * h
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
          out = 'Peptide/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
          os.makedirs(os.path.dirname(out), exist_ok=True)
          open(out, 'wb').write(make_png(1024, 1024, 0, 102, 204))
          print(f'generated fallback icon at {out}')
          PY
          fi
          xcodegen generate
          test -d "$PROJECT" || { echo "FATAL: xcodegen did not produce $PROJECT"; exit 1; }
          echo "Project ready: $PROJECT"

      - name: Install Python deps for ASC scripts
        run: |
          set -euo pipefail
          # macos-latest runners enforce PEP 668: the system Python's
          # site-packages is "externally managed" and rejects naked
          # `pip install`. Use an isolated venv so we install PyJWT and
          # cryptography without fighting the OS package manager, and
          # prepend it to PATH so subsequent `python3` calls resolve to it.
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/asc-venv/bin/activate"
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet PyJWT cryptography
          # Persist the venv's bin dir so later steps inherit it.
          echo "$RUNNER_TEMP/asc-venv/bin" >> "$GITHUB_PATH"
          python3 -c "import jwt, cryptography; print('jwt', jwt.__version__, 'cryptography', cryptography.__version__)"

      - name: Materialise ASC API key file
        env:
          APPLE_CONNECT_PRIVATE_KEY: ${{ secrets.APPLE_CONNECT_PRIVATE_KEY }}
          APPLE_CONNECT_KEY_ID:      ${{ secrets.APPLE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          # Some users paste the key with literal "\n" sequences instead of
          # real newlines; sed converts them. printf '%s' (no \n) avoids
          # adding an extra trailing newline if the secret already has one.
          printf '%s' "$APPLE_CONNECT_PRIVATE_KEY" \
            | sed 's/\\n/\n/g' \
            > "$ASC_KEY_PATH"
          cp "$ASC_KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_CONNECT_KEY_ID}.p8"
          chmod 600 "$ASC_KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_CONNECT_KEY_ID}.p8"
          KEY_SIZE=$(wc -c < "$ASC_KEY_PATH")
          echo "ASC key size: $KEY_SIZE bytes (expected ~240–320 for EC P-256 PEM)"
          if [ "$KEY_SIZE" -lt 100 ]; then
            echo "FATAL: ASC key file is only $KEY_SIZE bytes — APPLE_CONNECT_PRIVATE_KEY secret is empty or corrupt"
            exit 1
          fi
          # Verify PEM markers without leaking key contents.
          head -1 "$ASC_KEY_PATH"
          tail -1 "$ASC_KEY_PATH"
          ls -la "$HOME/.appstoreconnect/private_keys/"

      - name: Write embedded helper scripts to disk
        run: |
          set -euo pipefail
          mkdir -p ci/scripts

          cat > ci/scripts/asc_api.py <<'PYEOF'
          """ASC API helpers — JWT generation + GET/paginated GET."""
          from __future__ import annotations
          import json, os, sys, time, urllib.error, urllib.parse, urllib.request
          from typing import Any
          import jwt

          API_BASE = "https://api.appstoreconnect.apple.com"

          def _require(name: str) -> str:
              v = os.environ.get(name, "").strip()
              if not v:
                  print(f"::error::Missing env var {name}", file=sys.stderr); sys.exit(2)
              return v

          def make_token(ttl: int = 1200) -> str:
              key_id    = _require("APPLE_CONNECT_KEY_ID")
              issuer_id = _require("APPLE_CONNECT_ISSUER_ID")
              pkey      = _require("APPLE_CONNECT_PRIVATE_KEY")
              now = int(time.time())
              payload = {"iss": issuer_id, "iat": now, "exp": now + ttl, "aud": "appstoreconnect-v1"}
              return jwt.encode(payload, pkey, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"})

          def api_get(path: str, token: str | None = None, *, params: dict | None = None) -> dict[str, Any]:
              if token is None: token = make_token()
              url = path if path.startswith("http") else API_BASE + path
              if params:
                  url += ("&" if "?" in url else "?") + urllib.parse.urlencode(params, doseq=True)
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}", "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "ignore")
                  raise RuntimeError(f"ASC {e.code} {url}\n{body}") from e

          def follow_paginated(path: str, token: str | None = None, *, params: dict | None = None) -> list[dict]:
              if token is None: token = make_token()
              out: list[dict] = []
              page = api_get(path, token, params=params)
              out.extend(page.get("data", []))
              while page.get("links", {}).get("next"):
                  page = api_get(page["links"]["next"], token)
                  out.extend(page.get("data", []))
              return out
          PYEOF

          cat > ci/scripts/preflight_check.py <<'PYEOF'
          #!/usr/bin/env python3
          """Verify Team ID, bundle visibility, capabilities, iCloud container linkage."""
          from __future__ import annotations
          import base64, json, os, re, subprocess, sys, tempfile
          from pathlib import Path
          from asc_api import api_get, follow_paginated, make_token

          PRIMARY_BUNDLE   = os.environ.get("PRIMARY_BUNDLE", "com.peptidesai.app")
          ICLOUD_CONTAINER = os.environ.get("ICLOUD_CONTAINER", "iCloud.com.peptidesai.app")
          REQUIRED_CAPS = {
              "com.peptidesai.app":             ["ICLOUD", "APP_GROUPS"],
              "com.peptidesai.app.widgets":     ["APP_GROUPS"],
              "com.peptidesai.app.watchkitapp": ["APP_GROUPS"],
          }

          def banner(t): print("\n" + "="*72 + f"\n{t}\n" + "="*72)
          def fail(m): print(f"::error::{m}", file=sys.stderr); sys.exit(1)

          def derive_team_id_from_cert():
              b64 = os.environ.get("APPLE_CERTIFICATE_BASE64", "")
              pwd = os.environ.get("APPLE_CERTIFICATE_PASSWORD", "")
              if not b64:
                  print("APPLE_CERTIFICATE_BASE64 not set; skipping cert team derivation."); return None
              with tempfile.TemporaryDirectory() as tmp:
                  p12 = Path(tmp)/"c.p12"; pem = Path(tmp)/"c.pem"
                  p12.write_bytes(base64.b64decode(b64))
                  for extra in (["-legacy"], []):
                      try:
                          subprocess.run(["openssl","pkcs12","-in",str(p12),"-clcerts","-nokeys",
                                          "-passin",f"pass:{pwd}","-out",str(pem),*extra],
                                         check=True, capture_output=True); break
                      except subprocess.CalledProcessError: continue
                  subj = subprocess.run(["openssl","x509","-in",str(pem),"-noout","-subject"],
                                        check=True, capture_output=True, text=True).stdout
                  m = re.search(r"OU\s*=\s*([A-Z0-9]{10})", subj) or re.search(r"\(([A-Z0-9]{10})\)", subj)
                  return m.group(1) if m else None

          def check_team_id():
              banner("1. Team ID consistency")
              expected = os.environ.get("APPLE_TEAM_ID","").strip()
              if not expected: fail("APPLE_TEAM_ID secret is empty.")
              cert_team = derive_team_id_from_cert()
              print(f"APPLE_TEAM_ID secret      = {expected}")
              print(f"Cert OU (derived team ID) = {cert_team!r}")
              if cert_team and cert_team != expected:
                  fail(f"Team ID mismatch: cert={cert_team!r}, secret={expected!r}. "
                       "This is almost certainly the root cause of the entitlements rejection.")
              print("OK - secret and cert agree.")

          def fetch_bundle(ident, token):
              res = api_get("/v1/bundleIds", token, params={"filter[identifier]": ident, "limit": 200})
              for b in res.get("data", []):
                  if b.get("attributes",{}).get("identifier") == ident: return b
              return None

          def check_bundles_reachable(token):
              banner("2. Bundle IDs reachable via ASC API")
              found = {}
              for ident in REQUIRED_CAPS:
                  b = fetch_bundle(ident, token)
                  if not b: fail(f"ASC returned no bundle ID matching {ident!r} (wrong team?).")
                  print(f"  {ident:<40} -> id={b['id']}"); found[ident] = b
              return found

          def check_required_caps(bundles, token):
              banner("3. Required capabilities enabled")
              all_caps = {}
              for ident, required in REQUIRED_CAPS.items():
                  # Apple's ASC API treats /v1/bundleIds/{id}/bundleIdCapabilities
                  # as a relationship endpoint and rejects 'limit' with a 400
                  # PARAMETER_ERROR.ILLEGAL. Don't pass it. Caps per bundle are
                  # always tiny (single digits), so default paging is fine.
                  caps = follow_paginated(f"/v1/bundleIds/{bundles[ident]['id']}/bundleIdCapabilities", token)
                  all_caps[ident] = caps
                  present = sorted({c["attributes"].get("capabilityType") for c in caps if c.get("attributes")})
                  print(f"  {ident}\n    enabled: {present}")
                  missing = [r for r in required if r not in present]
                  if missing: fail(f"  {ident}: missing capabilities {missing}.")
              print("OK - all required capabilities present.")
              return all_caps

          def strategy_a(icloud_cap, container):
              settings = icloud_cap.get("attributes",{}).get("settings") or []
              print("  [A] ICLOUD settings dump:")
              print("    " + json.dumps(settings, indent=2).replace("\n","\n    "))
              for s in settings:
                  if "CONTAINER" in (s.get("key") or "").upper():
                      for o in (s.get("options") or []):
                          if container in " ".join(str(v) for v in o.values()): return True
                  if container in json.dumps(s): return True
              return False

          def strategy_b(container, bundle_internal_id, token):
              print("  [B] /v1/iCloudContainers (filter then full-list fallback)...")
              matches = []
              try:
                  res = api_get("/v1/iCloudContainers", token,
                                params={"filter[identifier]": container, "include": "bundleIds", "limit": 50})
                  matches = [c for c in res.get("data",[]) if c.get("attributes",{}).get("identifier")==container]
              except RuntimeError as e: print(f"    filtered failed: {e}")
              if not matches:
                  print("    filter returned 0 - falling back to full list")
                  try:
                      allc = follow_paginated("/v1/iCloudContainers", token, params={"include":"bundleIds","limit":200})
                      matches = [c for c in allc if c.get("attributes",{}).get("identifier")==container]
                  except RuntimeError as e:
                      print(f"    full list also failed: {e}"); return None
              if not matches:
                  print(f"    container {container!r} INVISIBLE to this API key.")
                  print("    -> strong Team ID mismatch signal."); return False
              cont = matches[0]
              print(f"    container id = {cont['id']}")
              rel = (cont.get("relationships",{}).get("bundleIds",{}) or {})
              ids = [r.get("id") for r in (rel.get("data") or [])]
              print(f"    relationships.bundleIds -> {ids}")
              if bundle_internal_id in ids: return True
              link = (rel.get("links",{}) or {}).get("related")
              if link:
                  try:
                      sub = api_get(link, token); subids = [b.get("id") for b in sub.get("data",[])]
                      print(f"    follow link -> {subids}")
                      return bundle_internal_id in subids
                  except RuntimeError as e: print(f"    link fetch failed: {e}")
              return False

          def strategy_c(bundle_internal_id, container, token):
              print("  [C] /v1/bundleIds/{id}/relationships/iCloudContainers")
              try:
                  res = api_get(f"/v1/bundleIds/{bundle_internal_id}/relationships/iCloudContainers", token)
              except RuntimeError as e:
                  print(f"    failed (endpoint may not exist): {e}"); return None
              ids = [r.get("id") for r in res.get("data",[])]
              print(f"    related container ids = {ids}")
              for rid in ids:
                  try:
                      c = api_get(f"/v1/iCloudContainers/{rid}", token)
                      if c.get("data",{}).get("attributes",{}).get("identifier")==container: return True
                  except RuntimeError: continue
              return False

          def check_icloud_linkage(bundles, all_caps, token):
              banner("4. iCloud container linkage")
              bid = bundles[PRIMARY_BUNDLE]["id"]
              cap = next((c for c in all_caps[PRIMARY_BUNDLE] if c["attributes"].get("capabilityType")=="ICLOUD"), None)
              if not cap: fail(f"{PRIMARY_BUNDLE}: ICLOUD capability missing.")
              a = strategy_a(cap, ICLOUD_CONTAINER); print(f"  Strategy A: {a}")
              b = strategy_b(ICLOUD_CONTAINER, bid, token); print(f"  Strategy B: {b}")
              c = strategy_c(bid, ICLOUD_CONTAINER, token); print(f"  Strategy C: {c}")
              if any([a,b,c]):
                  print(f"OK - {ICLOUD_CONTAINER!r} linked to {PRIMARY_BUNDLE!r} per >=1 endpoint.")
                  return
              print("\n::error::iCloud container linkage NOT verifiable via ASC API.")
              print("  Likely cause: ASC propagation delay (re-run in 10 min) or Team ID mismatch.")
              print("::warning::Continuing anyway so the archive step can prove or disprove this.")

          def main():
              tok = make_token(); check_team_id()
              bundles = check_bundles_reachable(tok)
              caps = check_required_caps(bundles, tok)
              check_icloud_linkage(bundles, caps, tok)
              banner("Preflight done.")

          if __name__ == "__main__": main()
          PYEOF

          cat > ci/scripts/dump_asc_profiles.py <<'PYEOF'
          #!/usr/bin/env python3
          """Print every ASC profile for the three bundle IDs + decoded entitlements."""
          from __future__ import annotations
          import base64, json, plistlib, subprocess, tempfile
          from pathlib import Path
          from asc_api import api_get, follow_paginated, make_token

          TARGETS = {"com.peptidesai.app", "com.peptidesai.app.widgets", "com.peptidesai.app.watchkitapp"}

          def decode(b64):
              if not b64: return None
              with tempfile.NamedTemporaryFile(suffix=".mobileprovision", delete=False) as f:
                  f.write(base64.b64decode(b64)); path = f.name
              try:
                  return plistlib.loads(subprocess.check_output(["security","cms","-D","-i",path]))
              except Exception as e: print(f"  decode failed: {e}"); return None
              finally: Path(path).unlink(missing_ok=True)

          def main():
              tok = make_token()
              print("Fetching all profiles + bundleId...")
              page = api_get("/v1/profiles", tok, params={"include":"bundleId","limit":200})
              profiles = list(page.get("data", []))
              bundles_by_id = {i["id"]: i.get("attributes",{}).get("identifier","?")
                               for i in page.get("included",[]) if i.get("type")=="bundleIds"}
              while page.get("links",{}).get("next"):
                  page = api_get(page["links"]["next"], tok)
                  profiles.extend(page.get("data",[]))
                  for i in page.get("included",[]):
                      if i.get("type")=="bundleIds":
                          bundles_by_id[i["id"]] = i.get("attributes",{}).get("identifier","?")
              matched = 0
              for p in profiles:
                  rel = (p.get("relationships",{}).get("bundleId",{}) or {}).get("data") or {}
                  ident = bundles_by_id.get(rel.get("id"), "?")
                  if ident not in TARGETS: continue
                  matched += 1
                  a = p.get("attributes",{})
                  print("\n" + "-"*72)
                  print(f"name:       {a.get('name')}")
                  print(f"  type:     {a.get('profileType')}")
                  print(f"  bundle:   {ident}")
                  print(f"  state:    {a.get('profileState')}")
                  print(f"  expires:  {a.get('expirationDate')}")
                  print(f"  uuid:     {a.get('uuid')}")
                  pl = decode(a.get("profileContent",""))
                  if not pl: print("  entitlements: <unavailable>"); continue
                  ents = pl.get("Entitlements", {}) or {}
                  print("  Entitlements:")
                  for k in sorted(ents):
                      v = ents[k]
                      if isinstance(v,(list,dict)): v = json.dumps(v, default=str)
                      print(f"    {k} = {v}")
              print(f"\nMatched {matched} profile(s).")
              if matched == 0:
                  print("::warning::No profiles in ASC for these bundles - Xcode auto-prov will create them.")

          if __name__ == "__main__": main()
          PYEOF

          cat > ci/scripts/dump_local_profiles.sh <<'SHEOF'
          #!/usr/bin/env bash
          set -u
          paths=(
            "$HOME/Library/MobileDevice/Provisioning Profiles"
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          )
          found=0
          for d in "${paths[@]}"; do
            echo; echo "==== $d ===="
            [[ -d "$d" ]] || { echo "  (does not exist)"; continue; }
            shopt -s nullglob; files=("$d"/*.mobileprovision "$d"/*.provisionprofile); shopt -u nullglob
            [[ ${#files[@]} -eq 0 ]] && { echo "  (exists but empty)"; continue; }
            for f in "${files[@]}"; do
              found=1; echo; echo "---- $f ----"
              tmp="$(mktemp -t prof.XXXXXX).plist"
              if security cms -D -i "$f" >"$tmp" 2>/dev/null; then
                /usr/libexec/PlistBuddy -c 'Print :Name' -c 'Print :UUID' \
                  -c 'Print :TeamIdentifier' -c 'Print :AppIDName' \
                  -c 'Print :Entitlements' "$tmp" || true
              else echo "  (cms decode failed)"; fi
              rm -f "$tmp"
            done
          done
          [[ $found -eq 0 ]] && echo "::warning::No .mobileprovision files - xcodebuild never wrote any."
          SHEOF

          chmod +x ci/scripts/*.py ci/scripts/*.sh
          ls -la ci/scripts/

      - name: Preflight - Team ID, bundle visibility, capabilities, iCloud linkage
        env:
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CONNECT_KEY_ID:        ${{ secrets.APPLE_CONNECT_KEY_ID }}
          APPLE_CONNECT_ISSUER_ID:     ${{ secrets.APPLE_CONNECT_ISSUER_ID }}
          APPLE_CONNECT_PRIVATE_KEY:   ${{ secrets.APPLE_CONNECT_PRIVATE_KEY }}
          APPLE_CERTIFICATE_BASE64:    ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD:  ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: python3 ci/scripts/preflight_check.py

      - name: Diagnostic - dump ASC profiles + entitlements
        env:
          APPLE_CONNECT_KEY_ID:      ${{ secrets.APPLE_CONNECT_KEY_ID }}
          APPLE_CONNECT_ISSUER_ID:   ${{ secrets.APPLE_CONNECT_ISSUER_ID }}
          APPLE_CONNECT_PRIVATE_KEY: ${{ secrets.APPLE_CONNECT_PRIVATE_KEY }}
        run: python3 ci/scripts/dump_asc_profiles.py
        continue-on-error: true

      - name: Import signing certificate to a fresh keychain
        env:
          APPLE_CERTIFICATE_BASE64:   ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PWD="$(uuidgen)"
          KEYCHAIN_PATH="$RUNNER_TEMP/$KEYCHAIN_NAME"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"
          P12_PATH="$RUNNER_TEMP/cert.p12"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$P12_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH" >/dev/null
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm -f "$P12_PATH"

      - name: Diagnostic - profile cache state BEFORE archive
        run: bash ci/scripts/dump_local_profiles.sh
        continue-on-error: true

      - name: Force fresh profile fetch (clear cache)
        run: |
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                   "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            [[ -d "$d" ]] && rm -rf "$d"/* "$d"/.??* 2>/dev/null || true
          done
          echo "Profile cache cleared."

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          if [[ -d "Peptide.xcworkspace" ]]; then
            xcodebuild -resolvePackageDependencies -workspace Peptide.xcworkspace -scheme "$SCHEME"
          else
            xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"
          fi

      - name: Archive
        env:
          APPLE_TEAM_ID:             ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CONNECT_KEY_ID:      ${{ secrets.APPLE_CONNECT_KEY_ID }}
          APPLE_CONNECT_ISSUER_ID:   ${{ secrets.APPLE_CONNECT_ISSUER_ID }}
          BUILD_NUMBER:              ${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p build
          KEYCHAIN_PATH="$RUNNER_TEMP/$KEYCHAIN_NAME"
          ARGS=(
            -project "$PROJECT"
            -scheme  "$SCHEME"
            -configuration "$CONFIGURATION"
            -destination "generic/platform=iOS"
            -archivePath "$ARCHIVE_PATH"
            -allowProvisioningUpdates
            -authenticationKeyID       "$APPLE_CONNECT_KEY_ID"
            -authenticationKeyIssuerID "$APPLE_CONNECT_ISSUER_ID"
            -authenticationKeyPath     "$ASC_KEY_PATH"
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
            CODE_SIGN_STYLE=Automatic
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"
          )
          if [[ -d "Peptide.xcworkspace" ]]; then
            ARGS=(-workspace Peptide.xcworkspace "${ARGS[@]:1}")
          fi
          set -o pipefail
          xcodebuild "${ARGS[@]}" archive 2>&1 | tee build/archive.log
          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "FATAL: xcodebuild reported success but $ARCHIVE_PATH does not exist."
            exit 1
          fi
          echo "Archive created at $ARCHIVE_PATH"

      - name: Verify archive Info.plist
        run: |
          set -euo pipefail
          APP_PLIST="$ARCHIVE_PATH/Products/Applications/Peptide.app/Info.plist"
          if [ ! -f "$APP_PLIST" ]; then
            echo "FATAL: archived app Info.plist not found at $APP_PLIST"
            ls -laR "$ARCHIVE_PATH/Products" || true
            exit 1
          fi
          STAMPED=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PLIST")
          echo "Archived CFBundleVersion = $STAMPED"
          if [ "$STAMPED" = "1" ] || [ "$STAMPED" = '$(CURRENT_PROJECT_VERSION)' ] || [ -z "$STAMPED" ]; then
            echo "FATAL: archived app has unstamped CFBundleVersion ('$STAMPED')."
            echo "       TestFlight will reject this upload as a duplicate of build 1."
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Print :UILaunchScreen" "$APP_PLIST" >/dev/null \
            || { echo "FATAL: archived app missing UILaunchScreen"; exit 1; }
          echo "Archive Info.plist verification passed."

      - name: Diagnostic - profile cache state AFTER archive
        if: always()
        run: |
          # Runs even when an earlier step failed. Guard against the script-
          # write step having been skipped (e.g. pip-install step blew up).
          if [ -f ci/scripts/dump_local_profiles.sh ]; then
            bash ci/scripts/dump_local_profiles.sh
          else
            echo "ci/scripts/dump_local_profiles.sh is not present — the"
            echo "'Write embedded helper scripts to disk' step did not run,"
            echo "so there is nothing to diagnose here. See the earlier"
            echo "step's failure log for the actual root cause."
          fi

      - name: Write exportOptions.plist
        if: success()
        run: |
          set -euo pipefail
          cat > build/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          EOF
          /usr/libexec/PlistBuddy -c "Print" build/exportOptions.plist

      - name: Export + upload to TestFlight
        if: success()
        env:
          APPLE_CONNECT_KEY_ID:    ${{ secrets.APPLE_CONNECT_KEY_ID }}
          APPLE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath  "$EXPORT_DIR" \
            -exportOptionsPlist build/exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID       "$APPLE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_CONNECT_ISSUER_ID" \
            -authenticationKeyPath     "$ASC_KEY_PATH"
          ls -la "$EXPORT_DIR"

      - name: Upload archive log + IPA on any outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ github.run_number }}
          path: |
            build/archive.log
            build/export/*.ipa
            build/exportOptions.plist
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup keychain + key material
        if: always()
        env:
          APPLE_CONNECT_KEY_ID: ${{ secrets.APPLE_CONNECT_KEY_ID }}
        run: |
          # Always-runs cleanup. Tolerate missing keychain (e.g. when an
          # earlier step failed before import) so this step never reports
          # a false failure that masks the real upstream error.
          KEYCHAIN_PATH="$RUNNER_TEMP/$KEYCHAIN_NAME"
          if [ -f "$KEYCHAIN_PATH" ] || [ -d "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
          rm -f "$ASC_KEY_PATH" 2>/dev/null || true
          if [ -n "${APPLE_CONNECT_KEY_ID:-}" ]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_CONNECT_KEY_ID}.p8" 2>/dev/null || true
          fi
          echo "Cleanup complete."

name: iOS TestFlight Deploy

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CONNECT_KEY_ID: ${{ secrets.APPLE_CONNECT_KEY_ID }}
          APPLE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_CONNECT_ISSUER_ID }}
          APPLE_CONNECT_PRIVATE_KEY: ${{ secrets.APPLE_CONNECT_PRIVATE_KEY }}
        run: |
          MISSING=0
          check_secret() {
            if [ -z "$2" ]; then
              echo "FATAL: Secret '$1' is not set or empty"
              MISSING=1
            else
              echo "OK: $1 is configured"
            fi
          }
          check_secret "APPLE_CERTIFICATE_BASE64" "$APPLE_CERTIFICATE_BASE64"
          check_secret "APPLE_CERTIFICATE_PASSWORD" "$APPLE_CERTIFICATE_PASSWORD"
          check_secret "APPLE_PROVISIONING_PROFILE" "$APPLE_PROVISIONING_PROFILE"
          check_secret "APPLE_TEAM_ID" "$APPLE_TEAM_ID"
          check_secret "APPLE_CONNECT_KEY_ID" "$APPLE_CONNECT_KEY_ID"
          check_secret "APPLE_CONNECT_ISSUER_ID" "$APPLE_CONNECT_ISSUER_ID"
          check_secret "APPLE_CONNECT_PRIVATE_KEY" "$APPLE_CONNECT_PRIVATE_KEY"
          if [ "$MISSING" -ne 0 ]; then
            echo ""
            echo "One or more required secrets are missing."
            echo "See TESTFLIGHT_SETUP.md for setup instructions."
            exit 1
          fi

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode version
        run: |
          xcodebuild -version
          echo "iOS SDK: $(xcrun --show-sdk-version --sdk iphoneos)"

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Cellar/xcodegen
            /opt/homebrew/Cellar/xcodegen
          key: brew-xcodegen-${{ runner.os }}-${{ runner.arch }}

      - name: Install XcodeGen
        run: |
          if command -v xcodegen &> /dev/null; then
            echo "XcodeGen already available: $(xcodegen --version)"
          else
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify Info.plist keys
        run: |
          PLIST="Peptide/Resources/Info.plist"
          echo "=== Info.plist contents ==="
          cat "$PLIST"
          echo ""
          echo "=== Verifying required keys ==="
          /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations" "$PLIST" || { echo "FATAL: UISupportedInterfaceOrientations missing"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations~ipad" "$PLIST" || { echo "FATAL: UISupportedInterfaceOrientations~ipad missing"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :UILaunchScreen" "$PLIST" || { echo "FATAL: UILaunchScreen missing"; exit 1; }
          echo "All required keys present."

      - name: Generate app icon
        run: |
          python3 - << 'EOF'
          import struct, zlib, os

          def make_png(width, height, r, g, b):
              def chunk(name, data):
                  c = zlib.crc32(name + data) & 0xffffffff
                  return struct.pack('>I', len(data)) + name + data + struct.pack('>I', c)
              ihdr = struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0)
              scanline = b'\x00' + bytes([r, g, b]) * width
              raw = scanline * height
              idat = zlib.compress(raw)
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', idat) + chunk(b'IEND', b'')

          out = 'Peptide/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
          os.makedirs(os.path.dirname(out), exist_ok=True)
          with open(out, 'wb') as f:
              f.write(make_png(1024, 1024, 0, 102, 204))
          print(f"Generated {out}")
          EOF

      - name: Import certificate
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$CERTIFICATE" | base64 --decode > "$CERT_PATH"

          CERT_SIZE=$(stat -f%z "$CERT_PATH" 2>/dev/null || stat --printf="%s" "$CERT_PATH" 2>/dev/null)
          if [ "$CERT_SIZE" -lt 100 ]; then
            echo "FATAL: Decoded certificate is only $CERT_SIZE bytes — secret is likely empty or corrupt"
            exit 1
          fi
          echo "Certificate decoded: $CERT_SIZE bytes"

          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import "$CERT_PATH" -k build.keychain -P "$PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm -f "$CERT_PATH"
          echo "Certificate imported successfully"

      - name: Import provisioning profile
        id: profile
        env:
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          PROFILE_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILE_DIR"
          PROFILE_PATH="$PROFILE_DIR/profile.mobileprovision"
          echo "$PROFILE" | base64 --decode > "$PROFILE_PATH"

          PROFILE_SIZE=$(stat -f%z "$PROFILE_PATH" 2>/dev/null || stat --printf="%s" "$PROFILE_PATH" 2>/dev/null)
          if [ "$PROFILE_SIZE" -lt 100 ]; then
            echo "FATAL: Decoded provisioning profile is only $PROFILE_SIZE bytes — secret is likely empty or corrupt"
            exit 1
          fi
          echo "Provisioning profile decoded: $PROFILE_SIZE bytes"

          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          if [ -z "$PROFILE_UUID" ]; then
            echo "FATAL: Could not extract UUID from provisioning profile"
            exit 1
          fi
          echo "Provisioning profile UUID: $PROFILE_UUID"
          echo "uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"

      - name: Build archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          echo "Building build #$BUILD_NUMBER"

          xcodebuild archive \
            -project Peptide.xcodeproj \
            -scheme Peptide \
            -archivePath "$RUNNER_TEMP/Peptide.xcarchive" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.profile.outputs.uuid }}" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain build.keychain" \
            | tee "$RUNNER_TEMP/xcodebuild-archive.log"

          if [ ! -d "$RUNNER_TEMP/Peptide.xcarchive" ]; then
            echo "FATAL: Archive was not created"
            exit 1
          fi
          echo "Archive created successfully"

      - name: Verify archive Info.plist
        run: |
          APP_PLIST="$RUNNER_TEMP/Peptide.xcarchive/Products/Applications/Peptide.app/Info.plist"
          echo "=== Archive bundle Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print" "$APP_PLIST"
          echo ""
          echo "=== Verifying required keys in archive ==="
          /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations" "$APP_PLIST" || { echo "FATAL: UISupportedInterfaceOrientations missing from archive"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :UILaunchScreen" "$APP_PLIST" || { echo "FATAL: UILaunchScreen missing from archive"; exit 1; }
          echo "Archive verification passed."

      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_UUID: ${{ steps.profile.outputs.uuid }}
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.peptidesai.app</key>
              <string>${PROFILE_UUID}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          echo "=== exportOptions.plist ==="
          cat "$RUNNER_TEMP/exportOptions.plist"
          echo "=========================="

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Peptide.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            | tee "$RUNNER_TEMP/xcodebuild-export.log"

          IPA_COUNT=$(ls "$RUNNER_TEMP/export/"*.ipa 2>/dev/null | wc -l)
          if [ "$IPA_COUNT" -eq 0 ]; then
            echo "FATAL: No IPA file found in export directory"
            ls -la "$RUNNER_TEMP/export/" || true
            exit 1
          fi
          echo "IPA exported successfully"
          ls -lh "$RUNNER_TEMP/export/"*.ipa

      - name: Setup App Store Connect API key
        env:
          API_KEY: ${{ secrets.APPLE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPLE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$API_KEY" > ~/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${KEY_ID}.p8
          echo "API key written for key ID: $KEY_ID"

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APPLE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH=$(ls "$RUNNER_TEMP/export/"*.ipa | head -1)
          echo "Uploading: $IPA_PATH ($(stat -f%z "$IPA_PATH") bytes)"

          UPLOAD_LOG="$RUNNER_TEMP/upload.log"

          if xcrun altool --help 2>&1 | grep -q "upload-app"; then
            echo "Using xcrun altool for upload"
            xcrun altool --upload-app \
              --type ios \
              --file "$IPA_PATH" \
              --apiKey "$KEY_ID" \
              --apiIssuer "$ISSUER_ID" 2>&1 | tee "$UPLOAD_LOG"
          else
            echo "altool not available, using xcodebuild for upload"
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/Peptide.xcarchive" \
              -exportPath "$RUNNER_TEMP/upload-export" \
              -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
              -allowProvisioningUpdates \
              -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER_ID" 2>&1 | tee "$UPLOAD_LOG"
          fi

          if grep -qi "ERROR" "$UPLOAD_LOG"; then
            echo ""
            echo "FATAL: Upload to TestFlight failed. See errors above."
            exit 1
          fi

          echo "Upload to TestFlight complete. Build will appear in App Store Connect within 15-30 minutes."

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/xcodebuild-archive.log
            ${{ runner.temp }}/xcodebuild-export.log
          retention-days: 30
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          rm -f ~/private_keys/AuthKey_*.p8 2>/dev/null || true

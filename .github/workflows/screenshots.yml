name: Screenshots

# Manual, opt-in job that captures real app screenshots for PR review.
# Runs the ScreenshotTests UI test (which boots the app in demo mode and
# grabs each tab), then exports the screenshots from the .xcresult and
# uploads them as a downloadable `app-screenshots` artifact.
#
# workflow_dispatch only — never gates a PR, so it can't block merges.
#
# Uses the `PeptideUICapture` scheme, which builds the app and the UI tests
# and nothing else, so a capture run doesn't also compile the unit suite.
#
# Captures three passes per tab: dark, light, and Accessibility XXXL. Light
# and XXXL exist because the trait-resolving colour tokens and the six-step
# type scale are both invisible to a single default-appearance run.
on:
  workflow_dispatch:
    inputs:
      simulator:
        description: "Simulator device to capture on (blank = iPhone 17 Pro, else iPhone 16 Pro, each on its newest iOS runtime)"
        required: false
        default: ""
        type: string

      test_filter:
        description: "XCTest selector (blank captures all surfaces)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen || brew reinstall xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate body-map regions
        run: python3 scripts/anatomy-review.py

      - name: Pick a simulator
        # This workflow has never once run, so its hardcoded "iPhone 16"
        # default was never verified to exist on the runner's Xcode — and an
        # empty `inputs.simulator` would produce `name=,OS=latest`. Resolve a
        # real device and fail loudly with the device list if there is none.
        #
        # The device-name extraction below matches the trailing UDID in
        # parens rather than truncating at the first "(" — several real
        # device names (e.g. "iPhone SE (3rd generation)") have their own
        # parens before the UDID, and cutting at the first one silently
        # produced a bogus "iPhone SE" that no destination matches.
        # Resolved to a UDID, like pr-checks' unit-test step: a name plus
        # `OS=latest` still exits 70 whenever the newest installed runtime
        # is not the Xcode SDK's version.
        id: sim
        env:
          WANT: ${{ inputs.simulator }}
        run: |
          # The fallback is a named model on its newest iOS runtime, not
          # whichever iPhone the list happens to end with, so captures stay
          # comparable from run to run.
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, os, re, sys
          def version(runtime):
              return tuple(int(n) for n in re.findall(r'\d+', runtime.rsplit('.', 1)[-1]))
          runtimes = sorted(json.load(sys.stdin)['devices'].items(), key=lambda kv: version(kv[0]), reverse=True)
          devs = [x for rt, r in runtimes if '.iOS-' in rt for x in r if 'iPhone' in x.get('name', '')]
          for name in [os.environ.get('WANT'), 'iPhone 17 Pro', 'iPhone 16 Pro']:
              pick = next((x for x in devs if name and x['name'] == name), None)
              if pick:
                  break
          else:
              pick = (sorted(devs, key=lambda x: x['name'])[-1:] or [{}])[0]
              print(f'::warning::No pinned iPhone model found; using {pick.get(\"name\")}.', file=sys.stderr)
          print(pick.get('udid', ''))
          ")
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No iPhone simulator available on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $DEVICE_ID"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Validate training logic
        # pr-checks already gates on these tests. Here they only add
        # context to the captures, so a failure must not stop them.
        continue-on-error: true
        run: |
          xcodebuild test \
            -parallel-testing-enabled NO \
            -project Peptide.xcodeproj \
            -scheme PeptideTrainingValidation \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TrainingTests.xcresult

      - name: Run screenshot UI test
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          xcodebuild test \
            -parallel-testing-enabled NO \
            -project Peptide.xcodeproj \
            -scheme PeptideUICapture \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            "-only-testing:PeptideUITests/ScreenshotTests${TEST_FILTER:+/$TEST_FILTER}" \
            -resultBundlePath Screenshots.xcresult

      - name: Export screenshots from xcresult
        if: always()
        run: |
          set -x
          mkdir -p screenshots
          # Export every attachment (the captures are .keepAlways) plus a
          # manifest mapping the exported files back to their names.
          xcrun xcresulttool export attachments \
            --path Screenshots.xcresult \
            --output-path screenshots || true
          xcrun xcresulttool export attachments \
            --path TrainingTests.xcresult \
            --output-path screenshots/training || true
          ls -laR screenshots || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-screenshots
          path: screenshots/**
          if-no-files-found: warn
          retention-days: 14

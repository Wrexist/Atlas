name: Screenshots

# Manual, opt-in job that captures real app screenshots for PR review.
# Runs the ScreenshotTests UI test (which boots the app in demo mode and
# grabs each tab), then exports the screenshots from the .xcresult and
# uploads them as a downloadable `app-screenshots` artifact.
#
# workflow_dispatch only — never gates a PR, so it can't block merges.
#
# Uses the `PeptideUICapture` scheme, which builds the app and the UI tests
# and nothing else, so a capture run doesn't also compile the unit suite.
#
# Captures three passes per tab: dark, light, and Accessibility XXXL. Light
# and XXXL exist because the trait-resolving colour tokens and the six-step
# type scale are both invisible to a single default-appearance run.
on:
  workflow_dispatch:
    inputs:
      simulator:
        description: "Simulator device to capture on (blank = iPhone 17 Pro, else iPhone 16 Pro, each on its newest iOS runtime)"
        required: false
        default: ""
        type: string

      test_filter:
        description: "XCTest selector (blank captures all surfaces)"
        required: false
        default: ""
        type: string

      publish_branch:
        description: "Also force-push the PNGs to this throwaway branch, which must start with screenshots/ (blank = artifact only). Cloud sessions can't download artifacts but can fetch a branch."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check publish branch
        # Checked before the capture as well as in the publish job, so a
        # bad name fails in seconds rather than after the full run.
        if: ${{ inputs.publish_branch != '' }}
        env:
          BRANCH: ${{ inputs.publish_branch }}
        run: |
          case "$BRANCH" in
            screenshots/?*) ;;
            *) echo "::error::publish_branch must start with screenshots/ (got '$BRANCH')"; exit 1 ;;
          esac

      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        uses: ./.github/actions/setup-xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate body-map regions
        run: python3 scripts/anatomy-review.py

      - name: Pick a simulator
        # This workflow has never once run, so its hardcoded "iPhone 16"
        # default was never verified to exist on the runner's Xcode — and an
        # empty `inputs.simulator` would produce `name=,OS=latest`. Resolve a
        # real device and fail loudly with the device list if there is none.
        # Resolved to a UDID, like pr-checks' unit-test step: a name plus
        # `OS=latest` still exits 70 whenever the newest installed runtime
        # is not the Xcode SDK's version.
        id: sim
        env:
          WANT: ${{ inputs.simulator }}
        run: |
          # The fallback is a named model on its newest iOS runtime, not
          # whichever iPhone the list happens to end with, so captures stay
          # comparable from run to run. pr-checks picks the same way.
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 scripts/pick-simulator.py "$WANT" "iPhone 17 Pro" "iPhone 16 Pro") || {
            xcrun simctl list devices available
            exit 1
          }
          echo "Using simulator $DEVICE_ID"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Validate training logic
        # pr-checks already gates on these tests. Here they only add
        # context to the captures, so a failure must not stop them.
        continue-on-error: true
        run: |
          xcodebuild test \
            -parallel-testing-enabled NO \
            -project Peptide.xcodeproj \
            -scheme PeptideTrainingValidation \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TrainingTests.xcresult

      - name: Render widgets
        # Widget layouts rendered to images; like the training tests,
        # context for the captures, so a failure must not stop them.
        continue-on-error: true
        run: |
          xcodebuild test \
            -parallel-testing-enabled NO \
            -project Peptide.xcodeproj \
            -scheme PeptideWidgetRender \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath WidgetRenders.xcresult

      - name: Run screenshot UI test
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          xcodebuild test \
            -parallel-testing-enabled NO \
            -project Peptide.xcodeproj \
            -scheme PeptideUICapture \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            "-only-testing:PeptideUITests/ScreenshotTests${TEST_FILTER:+/$TEST_FILTER}" \
            -resultBundlePath Screenshots.xcresult

      - name: Export screenshots from xcresult
        if: always()
        run: |
          set -x
          mkdir -p screenshots
          # Export every attachment (the captures are .keepAlways) plus a
          # manifest mapping the exported files back to their names.
          xcrun xcresulttool export attachments \
            --path Screenshots.xcresult \
            --output-path screenshots || true
          xcrun xcresulttool export attachments \
            --path TrainingTests.xcresult \
            --output-path screenshots/training || true
          xcrun xcresulttool export attachments \
            --path WidgetRenders.xcresult \
            --output-path screenshots/widgets || true
          ls -laR screenshots || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-screenshots
          path: screenshots/**
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: screenshots
    if: ${{ always() && inputs.publish_branch != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app-screenshots
          path: out

      - name: Push screenshots to the throwaway branch
        env:
          BRANCH: ${{ inputs.publish_branch }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          # The push below is a force-push of a one-commit history, so it
          # must never be able to land on main or a live feature branch.
          case "$BRANCH" in
            screenshots/?*) ;;
            *) echo "::error::publish_branch must start with screenshots/ (got '$BRANCH')"; exit 1 ;;
          esac
          cd out
          find . -type f ! -name '*.png' ! -name 'manifest.json' -delete
          git init -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from run ${{ github.run_id }}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"

name: Exercise animation alpha preview

# Renders a few exercise clips with a transparent background (no black box, no
# glow) so the new look can be reviewed before re-rendering the whole library.
# Linux renders frames and a ProRes 4444 master; macOS turns it into
# HEVC-with-alpha, the only transparent video AVPlayer plays. Results land on
# the exercise-videos-alpha-preview branch (the cloud session can't download
# artifacts).
on:
  push:
    branches: [claude/project-thread-9vj9pu]
    paths: [tools/exercise-anim/alpha_preview.json]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        slug: [3_4_Sit-Up, Barbell_Squat, Dumbbell_Bicep_Curl]
    env:
      BLENDER_VERSION: 5.2.1
      ATLAS_PYTHON: python3
      ATLAS_ALPHA: "1"
      ATLAS_SAMPLES: 96
      ATLAS_RES: 896x1120   # 4:5, both sides even (yuv420p and HEVC need it)
      ATLAS_BODY: athletic  # the body Isac picked (gen_human.py BODIES), with short hair
      ATLAS_CLOTHES: "^short01"
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq ffmpeg jq libxi6 libxkbcommon0 libsm6 libgl1 libegl1 libxrender1 libxxf86vm1 libxfixes3
          python3 -m pip install --break-system-packages -q numpy scipy pillow
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender
          key: blender-${{ env.BLENDER_VERSION }}
      - name: Install Blender
        run: |
          dir="$RUNNER_TEMP/blender/blender-${BLENDER_VERSION}-linux-x64"
          if [ ! -x "$dir/blender" ]; then
            mkdir -p "$RUNNER_TEMP/blender"
            curl -fsSL "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" | tar -xJ -C "$RUNNER_TEMP/blender"
          fi
          echo "BLENDER=$dir/blender" >> "$GITHUB_ENV"
      - name: Install MPFB
        run: |
          url=$(curl -fsSL "https://extensions.blender.org/api/v1/extensions/" | jq -r '.data[] | select(.id == "mpfb") | .archive_url' | head -1)
          echo "MPFB archive: $url"
          curl -fsSL "$url" -o mpfb.zip
          "$BLENDER" -b --command extension install-file -r user_default -e mpfb.zip
      - name: Download MakeHuman system clothes (CC0)
        run: |
          mkdir -p "$RUNNER_TEMP/mh"
          for url in \
            http://files.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip \
            https://files.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip; do
            curl -fsSL "$url" -o mh.zip && break
          done
          if [ -s mh.zip ]; then unzip -q mh.zip -d "$RUNNER_TEMP/mh"; else
            git clone -q --depth 1 https://github.com/makehumancommunity/makehuman-assets "$RUNNER_TEMP/mh"
            (cd "$RUNNER_TEMP/mh" && git lfs pull 2>/dev/null || true)
          fi
          find "$RUNNER_TEMP/mh" -name "*.mhclo" | head -80
          echo "ATLAS_CLOTHES_DIR=$RUNNER_TEMP/mh" >> "$GITHUB_ENV"
      - name: Render clip
        working-directory: tools/exercise-anim
        run: |
          "$BLENDER" -b -P gen_human.py
          python3 gen_specs.py
          "$BLENDER" -b human.blend -P kit.py -- "${{ matrix.slug }}" --anim
          for f in out/${{ matrix.slug }}.mov out/${{ matrix.slug }}_light.mp4 out/${{ matrix.slug }}_dark.mp4; do
            [ -s "$f" ] || { echo "::error::$f is missing or empty"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/clip"
          cp out/${{ matrix.slug }}.mov out/${{ matrix.slug }}_light.mp4 out/${{ matrix.slug }}_dark.mp4 "$RUNNER_TEMP/clip/"
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-${{ matrix.slug }}
          path: ${{ runner.temp }}/clip
          retention-days: 7

  encode:
    needs: render
    if: always()
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: clips
          pattern: alpha-*
          merge-multiple: true
      - name: HEVC with alpha
        run: |
          mkdir -p hevc
          for src in clips/*.mov; do
            slug=$(basename "$src" .mov)
            avconvert --source "$src" --preset PresetHEVCHighestQualityWithAlpha --output "hevc/$slug.mov" --replace --verbose \
              || echo "::warning::avconvert failed for $slug"
          done
          ls -la hevc clips
      - name: Publish to exercise-videos-alpha-preview
        run: |
          repo="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git init -q -b exercise-videos-alpha-preview site
          cp clips/*.mp4 site/ 2>/dev/null || true
          cp hevc/*.mov site/ 2>/dev/null || true
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Alpha preview clips (run ${{ github.run_id }})"
          git push -fq "$repo" exercise-videos-alpha-preview

name: Anatomy Render

# Renders the photoreal muscle-map assets from the open-source Z-Anatomy
# model (CC-BY-SA 4.0). The model is fetched automatically — no manual
# hosting. The job installs Blender, opens the model headless, and runs
# tools/anatomy_render.py.
#
# Two phases (controlled by `recon`):
#   recon = true  (default): just dumps the model's collection + object
#       names (object_names.txt / collections.txt) so the GROUPS mapping
#       can be built from the real names. No render.
#   recon = false: renders the base bodies + 24 muscle masks once GROUPS,
#       cameras, and the muscular-system isolation are configured.
#
# Output is uploaded as the `anatomy-out` artifact. workflow_dispatch only.
#
# Attribution (required by CC-BY-SA): the muscle assets derive from
# Z-Anatomy (https://www.z-anatomy.com), CC-BY-SA 4.0 — credited in
# docs/PHOTOREAL_ANATOMY_PLAN.md and surfaced in-app before the assets ship.
on:
  workflow_dispatch:
    inputs:
      recon:
        description: "Recon only (dump names, no render)?"
        required: false
        default: true
        type: boolean
      blender_version:
        description: "Blender version"
        required: false
        default: "4.2.3"
        type: string
      model_url:
        description: "Override model URL (blank = fetch Z-Anatomy)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          set -euo pipefail
          V="${{ inputs.blender_version }}"
          MAJOR="${V%.*}"
          URL="https://download.blender.org/release/Blender${MAJOR}/blender-${V}-linux-x64.tar.xz"
          echo "Fetching $URL"
          curl -fsSL "$URL" -o blender.tar.xz
          mkdir -p "$HOME/blender"
          tar -xf blender.tar.xz -C "$HOME/blender" --strip-components=1
          echo "$HOME/blender" >> "$GITHUB_PATH"

      - name: Verify Blender
        run: blender --version

      - name: Fetch model
        run: |
          set -euo pipefail
          mkdir -p model
          OVERRIDE="${{ inputs.model_url }}"
          if [ -n "$OVERRIDE" ]; then
            echo "Using override model URL"
            curl -fsSL "$OVERRIDE" -o model/model.blend
          else
            echo "Fetching Z-Anatomy template (CC-BY-SA 4.0)"
            # HEAD resolves the repo's default branch, so this works
            # regardless of main/master.
            curl -fL "https://github.com/Z-Anatomy/The-blend/raw/HEAD/Z-Anatomy.zip" -o model/zanatomy.zip
            ls -lh model/zanatomy.zip
            unzip -q model/zanatomy.zip -d model/unzipped || true
            # Some distributions nest another zip — unzip any we find.
            for z in $(find model/unzipped -name '*.zip'); do
              echo "Unzipping nested $z"; unzip -q "$z" -d "$(dirname "$z")" || true
            done
          fi
          echo "=== .blend files found ==="
          find model -name '*.blend' -printf '%s\t%p\n' || true

      - name: Render / recon
        run: |
          set -euo pipefail
          mkdir -p out
          OVERRIDE="${{ inputs.model_url }}"
          if [ -n "$OVERRIDE" ]; then
            BLEND="model/model.blend"
          else
            # Prefer the template's startup.blend (the actual model scene),
            # not userpref.blend; fall back to the largest .blend.
            BLEND="$(find model -name 'startup.blend' | head -1)"
            if [ -z "$BLEND" ]; then
              BLEND="$(find model -name '*.blend' -printf '%s\t%p\n' | sort -rn | head -1 | cut -f2)"
            fi
          fi
          echo "Opening: $BLEND"
          if [ -z "$BLEND" ]; then echo "::error::No .blend found"; exit 1; fi

          RECON=0; [ "${{ inputs.recon }}" = "true" ] && RECON=1
          ATLAS_ANATOMY_OUT="$PWD/out" ATLAS_ANATOMY_RECON="$RECON" \
            blender "$BLEND" --background --python tools/anatomy_render.py
          echo "=== out/ ==="; ls -laR out || true

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anatomy-out
          path: out/**
          if-no-files-found: warn
          retention-days: 14

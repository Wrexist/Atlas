name: App Store Connect Sync

# Copies the store listing in this repo (APP_STORE_METADATA.md and the
# watch screenshots in marketing/app-store/) into App Store Connect for one
# version. Dry run unless `apply` is ticked; submits for App Review only
# when `submit` is ticked too.
on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'App Store version to update, e.g. 1.4.0. Created if it does not exist yet.'
        required: true
        type: string
      apply:
        description: 'Write the changes. Leave unticked for a dry run that only reports what would change.'
        required: false
        type: boolean
        default: false
      submit:
        description: 'Also submit the version for App Review (needs apply).'
        required: false
        type: boolean
        default: false
      withdraw:
        description: 'Only cancel a submission waiting for review so the version can be edited (needs apply).'
        required: false
        type: boolean
        default: false

concurrency:
  group: store-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install API client dependencies
        run: pip install 'pyjwt[crypto]==2.10.1' 'requests==2.32.3'
      - name: App Store metadata check
        # Guideline 3.1.2: the description must carry the EULA and privacy
        # links and every subscription's title, length and price. Build
        # 1.2.0 (135) was rejected without them, so never upload a listing
        # that fails the same gate pr-checks runs (audit B127).
        run: python3 scripts/check-store-metadata.py
      - name: Require main for writes
        # A dry run may come from any branch; a write may only publish
        # what main holds, mirroring the ios-testflight gate.
        if: inputs.apply
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Store sync writes only from main (got $GITHUB_REF). Untick apply for a dry run."
            exit 1
          fi
      - name: Sync listing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APP_VERSION: ${{ inputs.app_version }}
          APPLY: ${{ inputs.apply }}
          SUBMIT: ${{ inputs.submit }}
          WITHDRAW: ${{ inputs.withdraw }}
        run: |
          args=(--version "$APP_VERSION")
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          if [ "$SUBMIT" = "true" ]; then args+=(--submit); fi
          if [ "$WITHDRAW" = "true" ]; then args+=(--withdraw); fi
          python3 scripts/asc_store_sync.py "${args[@]}"

# Auto-version contract (see .github/workflows/ios-testflight.yml):
#
# Every shipping target MUST declare these four keys so the TestFlight
# pipeline can stamp a fresh `1.0.<run_number>` (or a manual override)
# across the whole archive:
#
#   settings.base:
#     MARKETING_VERSION: "1.0.X"          # rewritten by the workflow
#     CURRENT_PROJECT_VERSION: "X"        # rewritten to run_number
#
#   info.properties (only for targets with a custom Info.plist):
#     CFBundleShortVersionString: $(MARKETING_VERSION)
#     CFBundleVersion: $(CURRENT_PROJECT_VERSION)
#
#   For targets with GENERATE_INFOPLIST_FILE: YES, set the same values
#   via INFOPLIST_KEY_CFBundleShortVersionString /
#   INFOPLIST_KEY_CFBundleVersion in settings.base instead.
#
# Missing any of these on a sub-bundle is what got us "train 1.0
# closed" rejections from App Store Connect — Apple will reject the
# entire upload if a single embedded extension's version is stale.
name: Peptide
options:
  bundleIdPrefix: com.peptidesai
  deploymentTarget:
    iOS: "18.0"
  generateEmptyDirectories: true
  developmentLanguage: en
settings:
  base:
    # Swift 5 language mode. The codebase is not yet clean under Swift 6
    # strict concurrency on the current toolchain (Xcode 26.3) — a
    # number of pre-existing data-race / actor-isolation violations
    # surface as hard errors in Swift 6 mode. Swift 5 mode keeps every
    # concurrency feature (async/await, actors, @MainActor, Sendable)
    # working while downgrading those violations to warnings, so the
    # build compiles. Tighten back to "6.0" once the strict-concurrency
    # migration is complete.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_PREVIEWS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Peptide:
    type: application
    platform: iOS
    sources:
      - path: Peptide
        excludes:
          - "**/.DS_Store"
          - "Resources/Info.plist"
          - "Resources/AppStoreCovers/**"
          # Local StoreKit config — referenced by the scheme as
          # `storeKitConfiguration` for `xcodebuild test` /
          # SKTestSession only. EXCLUDING from the app bundle so a
          # device build can't accidentally hit the sandboxed local
          # products instead of App Store Connect — that would route
          # every TestFlight / prod purchase through a fake catalog.
          - "Resources/Products.storekit"
      - path: Shared
    info:
      path: Peptide/Resources/Info.plist
      properties:
        CFBundleDisplayName: Atlas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations:
          - en
          - es
          - zh-Hans
          - ja
          - de
          - fr
          - pt-BR
          - ko
          - ru
          - ar
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: "Atlas uses the camera to scan food barcodes, take a profile photo (stored locally), and photograph meals for nutrition estimation. Meal photos are sent securely to our AI service for analysis and are not retained after the response. Barcode and profile photos stay on your device."
        NSFaceIDUsageDescription: "Atlas uses Face ID to optionally lock the app, so your protocols and health data stay private if your device is unlocked. Face ID is optional — you can disable it in Settings."
        NSHealthShareUsageDescription: "Atlas reads heart rate, HRV, resting heart rate, body mass, steps, and active energy from Apple Health to correlate your peptide protocols with biometric trends. Atlas never writes to Apple Health and all analysis happens on your device."
        NSHealthUpdateUsageDescription: "Atlas does not write to Apple Health and never modifies your health records."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peptidesai.app
        PRODUCT_NAME: Peptide
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "101"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Peptide/Peptide.entitlements
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
    dependencies:
      - target: PeptideWidgets
      - target: PeptideWatch
        embed: true
  PeptideWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PeptideWidgets
        excludes:
          - "**/.DS_Store"
          - Info.plist
      - path: Shared
    info:
      path: PeptideWidgets/Info.plist
      properties:
        CFBundleDisplayName: Atlas Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peptidesai.app.widgets
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "101"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: PeptideWidgets/PeptideWidgets.entitlements
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
  PeptideWatch:
    type: application
    platform: watchOS
    deploymentTarget:
      watchOS: "11.0"
    sources:
      - path: PeptideWatch
        excludes:
          - "**/.DS_Store"
      - path: Shared
    dependencies:
      - target: PeptideWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peptidesai.app.watchkitapp
        PRODUCT_NAME: PeptideWatch
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "101"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Atlas
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.peptidesai.app
        INFOPLIST_KEY_CFBundleShortVersionString: $(MARKETING_VERSION)
        INFOPLIST_KEY_CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: PeptideWatch/PeptideWatch.entitlements
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
  PeptideWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget:
      watchOS: "11.0"
    sources:
      - path: PeptideWatchWidgets
        excludes:
          - "**/.DS_Store"
          - Info.plist
      - path: Shared
    info:
      path: PeptideWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Atlas Watch Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peptidesai.app.watchkitapp.widgets
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "101"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: PeptideWatchWidgets/PeptideWatchWidgets.entitlements
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
  PeptideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PeptideTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Peptide
      # StoreKitTest is needed by StoreServiceTests so SKTestSession
      # can drive purchases against the bundled Products.storekit
      # config. The framework is part of the iOS 14+ SDK; nothing to
      # vendor.
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peptidesai.app.tests
        GENERATE_INFOPLIST_FILE: YES
  PeptideUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PeptideUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Peptide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peptidesai.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Peptide:
    build:
      targets:
        Peptide: all
        PeptideWidgets: all
        PeptideWatch: all
        PeptideWatchWidgets: all
        PeptideTests: [test]
        PeptideUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Peptide/Resources/Products.storekit
    test:
      config: Debug
      storeKitConfiguration: Peptide/Resources/Products.storekit
      targets:
        - PeptideTests
        - PeptideUITests
    archive:
      config: Release

  # UI-capture-only scheme.
  #
  # The `Peptide` scheme's test action builds `PeptideTests`, which currently
  # doesn't compile — so the screenshot job, whose whole purpose is to let a
  # human *look at the app*, was gated behind an unrelated unit-test backlog.
  # This scheme builds the app and the UI tests and nothing else, so the
  # visual loop stays available while that backlog is worked through.
  PeptideUICapture:
    build:
      targets:
        Peptide: all
        PeptideUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Peptide/Resources/Products.storekit
    test:
      config: Debug
      storeKitConfiguration: Peptide/Resources/Products.storekit
      targets:
        - PeptideUITests

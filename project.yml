name: Peptide
options:
  bundleIdPrefix: com.peptidesai
  deploymentTarget:
    iOS: "18.0"
  generateEmptyDirectories: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_PREVIEWS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Peptide:
    type: application
    platform: iOS
    sources:
      - path: Peptide
        excludes:
          - "**/.DS_Store"
          - "Resources/Info.plist"
          - "Resources/AppStoreCovers/**"
      - path: Shared
    info:
      path: Peptide/Resources/Info.plist
      properties:
        CFBundleDisplayName: PeptideX
        CFBundleLocalizations:
          - en
          - es
          - zh-Hans
          - ja
          - de
          - fr
          - pt-BR
          - ko
          - ru
          - ar
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: "PeptideX uses the camera so you can take a profile photo. The image is stored locally on your device and is never uploaded."
        NSFaceIDUsageDescription: "PeptideX uses Face ID to optionally lock the app, so your protocols and health data stay private if your device is unlocked. Face ID is optional — you can disable it in Settings."
        NSHealthShareUsageDescription: "PeptideX reads your health data so you can correlate peptide protocol compliance with metrics like heart rate variability, sleep quality, and activity. PeptideX never writes to Apple Health."
        NSHealthUpdateUsageDescription: "PeptideX does not write to Apple Health and never modifies your health records."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peptidesai.app
        PRODUCT_NAME: Peptide
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "101"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Peptide/Peptide.entitlements
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
    dependencies:
      - target: PeptideWidgets
      - target: PeptideWatch
        embed: true
  PeptideWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PeptideWidgets
        excludes:
          - "**/.DS_Store"
          - Info.plist
      - path: Shared
    info:
      path: PeptideWidgets/Info.plist
      properties:
        CFBundleDisplayName: PeptideX Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peptidesai.app.widgets
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "101"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: PeptideWidgets/PeptideWidgets.entitlements
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
  PeptideWatch:
    type: application
    platform: watchOS
    deploymentTarget:
      watchOS: "11.0"
    sources:
      - path: PeptideWatch
        excludes:
          - "**/.DS_Store"
      - path: Shared
    dependencies:
      - target: PeptideWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peptidesai.app.watchkitapp
        PRODUCT_NAME: PeptideWatch
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "101"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PeptideX
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.peptidesai.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: PeptideWatch/PeptideWatch.entitlements
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
  PeptideWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget:
      watchOS: "11.0"
    sources:
      - path: PeptideWatchWidgets
        excludes:
          - "**/.DS_Store"
          - Info.plist
      - path: Shared
    info:
      path: PeptideWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: PeptideX Watch Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peptidesai.app.watchkitapp.widgets
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "101"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: PeptideWatchWidgets/PeptideWatchWidgets.entitlements
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
  PeptideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PeptideTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Peptide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peptidesai.app.tests
        GENERATE_INFOPLIST_FILE: YES
  PeptideUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PeptideUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Peptide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peptidesai.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Peptide:
    build:
      targets:
        Peptide: all
        PeptideWidgets: all
        PeptideWatch: all
        PeptideWatchWidgets: all
        PeptideTests: [test]
        PeptideUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Peptide/Resources/Products.storekit
    test:
      config: Debug
      storeKitConfiguration: Peptide/Resources/Products.storekit
      targets:
        - PeptideTests
        - PeptideUITests
    archive:
      config: Release

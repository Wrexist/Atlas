name: Peptide
options:
  bundleIdPrefix: com.peptidesai
  deploymentTarget:
    iOS: "26.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_PREVIEWS: YES
targets:
  Peptide:
    type: application
    platform: iOS
    sources:
      - path: Peptide
        excludes:
          - "**/.DS_Store"
          - "Resources/Info.plist"
    info:
      path: Peptide/Resources/Info.plist
      properties:
        CFBundleDisplayName: PeptideX
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: "PeptideX uses your health data to correlate peptide protocol compliance with metrics like heart rate variability, sleep quality, and activity levels."
        NSHealthUpdateUsageDescription: "PeptideX does not write data to Apple Health. This permission is required by the HealthKit framework but will not be used to modify your health records."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peptidesai.app
        PRODUCT_NAME: Peptide
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
  PeptideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PeptideTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Peptide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peptidesai.app.tests
        GENERATE_INFOPLIST_FILE: YES
  PeptideUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PeptideUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Peptide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peptidesai.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Peptide:
    build:
      targets:
        Peptide: all
        PeptideTests: [test]
        PeptideUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PeptideTests
        - PeptideUITests
    archive:
      config: Release

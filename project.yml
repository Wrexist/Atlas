# Auto-version contract (see .github/workflows/ios-testflight.yml):
#
# Every shipping target MUST declare these four keys so the TestFlight
# pipeline can stamp a fresh auto version (or a manual override)
# across the whole archive:
#
#   settings.base:
#     MARKETING_VERSION: "1.0.X"          # rewritten by the workflow
#     CURRENT_PROJECT_VERSION: "X"        # rewritten to run_number
#
#   info.properties (only for targets with a custom Info.plist):
#     CFBundleShortVersionString: $(MARKETING_VERSION)
#     CFBundleVersion: $(CURRENT_PROJECT_VERSION)
#
#   For targets with GENERATE_INFOPLIST_FILE: YES, set the same values
#   via INFOPLIST_KEY_CFBundleShortVersionString /
#   INFOPLIST_KEY_CFBundleVersion in settings.base instead.
#
# Missing any of these on a sub-bundle is what got us "train 1.0
# closed" rejections from App Store Connect — Apple will reject the
# entire upload if a single embedded extension's version is stale.
#
# The only version source is ios-testflight's `marketing_version` input
# (passed to xcodebuild as MARKETING_VERSION by fastlane). The values in
# this file are placeholders and never reach a shipped build.
name: Peptide
options:
  bundleIdPrefix: com.peptidesai
  deploymentTarget:
    iOS: "18.0"
  generateEmptyDirectories: true
  developmentLanguage: en
  # English and Swedish.
  #
  # A language ships only when the app is actually in it. Swedish covers every
  # UI sentence in the catalog (`scripts/check-localization.py` gates it), so
  # it ships. The other nine languages stay withheld: their catalog covers only
  # the old 170 keys, a small fraction of today's UI, and shipping them would
  # put them on the App Store listing while handing those users a
  # mostly-English medical app.
  #
  # What actually decides this is the *catalog*, not any setting here.
  # Xcode derives the project's known regions from the localizations it finds,
  # so the languages in each target's `Localizable.xcstrings` are what compile
  # into `.lproj` folders — and those folders, not `CFBundleLocalizations`, are
  # what the App Store reads for the listing.
  #
  # The nine-language version of the old 170 keys is preserved verbatim at
  # `localization/Localizable.translated.xcstrings`, outside every target's
  # source path: withheld, not discarded. Restoring a language means
  # translating the full catalog, then adding it to CFBundleLocalizations below.
packages:
  # Exact, because the xcodeproj is generated and git-ignored, so no
  # Package.resolved is committed: `from:` let every CI and TestFlight
  # build resolve whatever 5.x was newest that day, and the purchase SDK
  # that passed PR checks was not guaranteed to be the one that shipped.
  # Bump deliberately, in its own PR.
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    exactVersion: 5.98.0
settings:
  base:
    # Swift 5 language mode. The codebase is not yet clean under Swift 6
    # strict concurrency on the current toolchain (Xcode 26.3) — a
    # number of pre-existing data-race / actor-isolation violations
    # surface as hard errors in Swift 6 mode. Swift 5 mode keeps every
    # concurrency feature (async/await, actors, @MainActor, Sendable)
    # working while downgrading those violations to warnings, so the
    # build compiles. Tighten back to "6.0" once the strict-concurrency
    # migration is complete.
    SWIFT_VERSION: "5.0"
    # `targeted` (not `minimal`) so the data-race diagnostics the
    # migration has to clear show up as warnings in every build, instead
    # of staying invisible until the switch to 6.0. Warnings only: in
    # Swift 5 mode this cannot fail the build.
    SWIFT_STRICT_CONCURRENCY: targeted
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_PREVIEWS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Peptide:
    type: application
    platform: iOS
    sources:
      - path: Peptide
        excludes:
          - "**/.DS_Store"
          - "Resources/Info.plist"
          - "Resources/AppStoreCovers/**"
          # Local StoreKit config — referenced by the scheme as
          # `storeKitConfiguration` for `xcodebuild test` /
          # SKTestSession only. EXCLUDING from the app bundle so a
          # device build can't accidentally hit the sandboxed local
          # products instead of App Store Connect — that would route
          # every TestFlight / prod purchase through a fake catalog.
          - "Resources/Products.storekit"
      - path: Shared
    info:
      path: Peptide/Resources/Info.plist
      properties:
        CFBundleDisplayName: Atlas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Matches the languages in the string catalogs. Declaring a language
        # here that the binary does not actually localize advertises it on the
        # App Store listing regardless. See the note on languages above.
        CFBundleLocalizations:
          - en
          - sv
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        # Ends a dose Live Activity when its window closes even if the
        # app isn't opened (DoseLiveActivityService). App refresh tasks
        # need the fetch background mode.
        BGTaskSchedulerPermittedIdentifiers:
          - com.peptidesai.app.doseWindowClose
        UIBackgroundModes:
          - fetch
        # The peptidex:// scheme predates this registration — widget and
        # Live Activity `widgetURL` links route to the containing app
        # without it — but notification deep links, Shortcuts, and any
        # external caller need the scheme declared to resolve.
        CFBundleURLTypes:
          - CFBundleURLName: com.peptidesai.app.deeplink
            CFBundleURLSchemes:
              - peptidex
              - atlas
        NSCameraUsageDescription: "Atlas uses the camera to scan food barcodes, take a profile photo (stored locally), and photograph meals, food packages and tables for nutrition estimation. Meal, package and table photos are sent securely to Anthropic's Claude, through Atlas's server, for analysis; Atlas's server does not store them. Barcode scans and profile photos stay on your device."
        NSFaceIDUsageDescription: "Atlas uses Face ID to optionally lock the app, so your protocols and health data stay private if your device is unlocked. Face ID is optional — you can disable it in Settings."
        NSHealthShareUsageDescription: "Atlas reads HRV, resting heart rate, VO2 max, sleep, and steps from Apple Health, plus weight if you turn on workout, weight and water sync, to show recovery trends, estimate your Biological Age, and correlate them with what you log. Once you log body fat, waist, blood pressure or body temperature on the Biology tab, it also reads that measurement to chart it there. Analysis happens on your device; if you enable the optional AI weekly summary, weekly averages of HRV, resting heart rate, and sleep hours are sent securely to Anthropic's Claude, through Atlas's server, to write your recap, and if you allow Ask Atlas on the Biology tab, a summary of your Biological Age and the readings behind it is sent the same way to answer your questions; Atlas's server does not store them."
        NSHealthUpdateUsageDescription: "Atlas only writes to Apple Health when you turn a setting on. With \"Sync workouts, weight and water\" on, it saves finished workouts, weigh-ins and water you log. With \"Write meals to Apple Health\" on, it saves the calories, protein, carbohydrates and fat from meals you log. Both settings are off until you enable them. When you log body fat, waist, blood pressure or body temperature on the Biology tab, Atlas saves that reading to Apple Health."
        NSMotionUsageDescription: "Atlas reads your phone's tilt only while a meal table is in play, so the plates roll the way you tilt. Motion data never leaves the screen."
        NSPhotoLibraryAddUsageDescription: "Atlas saves share images and videos to your Photo Library only when you choose Save to Photos, and saves a table photo only when you turn on Save original. Atlas does not read your Photo Library."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peptidesai.app
        PRODUCT_NAME: Peptide
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "101"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Peptide/Peptide.entitlements
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
    dependencies:
      - target: PeptideWidgets
      - target: PeptideWatch
        embed: true
      - package: RevenueCat
  PeptideWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PeptideWidgets
        excludes:
          - "**/.DS_Store"
          - Info.plist
      - path: Shared
    info:
      path: PeptideWidgets/Info.plist
      properties:
        CFBundleDisplayName: Atlas Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peptidesai.app.widgets
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "101"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: PeptideWidgets/PeptideWidgets.entitlements
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
  PeptideWatch:
    type: application
    platform: watchOS
    deploymentTarget:
      watchOS: "11.0"
    sources:
      - path: PeptideWatch
        excludes:
          - "**/.DS_Store"
      # Only the payload types the watch reads. The rest of Shared holds
      # iPhone-only App Intents and pending-log stores that nothing on the
      # watch drains, so a Shortcuts run there would be silently lost.
      - path: Shared/AppGroup.swift
      - path: Shared/WatchData.swift
      - path: Shared/WatchPalette.swift
      - path: Shared/WatchWorkout.swift
      - path: Shared/WidgetWorkoutSummary.swift
      - path: WatchShared
    dependencies:
      - target: PeptideWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peptidesai.app.watchkitapp
        PRODUCT_NAME: PeptideWatch
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "101"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Atlas
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.peptidesai.app
        INFOPLIST_KEY_CFBundleShortVersionString: $(MARKETING_VERSION)
        INFOPLIST_KEY_CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: PeptideWatch/PeptideWatch.entitlements
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
  PeptideWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget:
      watchOS: "11.0"
    sources:
      - path: PeptideWatchWidgets
        excludes:
          - "**/.DS_Store"
          - Info.plist
      - path: Shared/AppGroup.swift
      - path: Shared/WatchData.swift
      - path: Shared/WatchPalette.swift
      - path: Shared/WatchWorkout.swift
      - path: Shared/WidgetWorkoutSummary.swift
      - path: WatchShared
    info:
      path: PeptideWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Atlas Watch Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peptidesai.app.watchkitapp.widgets
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "101"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: PeptideWatchWidgets/PeptideWatchWidgets.entitlements
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
  PeptideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PeptideTests
        excludes:
          - "**/.DS_Store"
      # `SKTestSession(configurationFileNamed: "Products")` resolves the
      # file out of the *test* bundle, and the app target deliberately
      # excludes it (see above) so a device build can't transact against
      # the fake catalog. It was in neither bundle, so all fifteen
      # StoreServiceTests failed setUp with SKTestErrorDomain Code=4
      # "File not found" — the whole suite, on a missing resource.
      #
      # Copying it here keeps the app-bundle exclusion intact: the
      # config ships to the test runner only.
      - path: Peptide/Resources/Products.storekit
        buildPhase: resources
    dependencies:
      - target: Peptide
      # StoreKitTest is needed by StoreServiceTests so SKTestSession
      # can drive purchases against the bundled Products.storekit
      # config. The framework is part of the iOS 14+ SDK; nothing to
      # vendor.
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peptidesai.app.tests
        GENERATE_INFOPLIST_FILE: YES
  PeptideTrainingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PeptideTests/WeeklyMuscleHeatmapTests.swift
      - path: PeptideTests/MuscleGainsEngineTests.swift
      - path: PeptideTests/WorkoutFocusTests.swift
      - path: PeptideTests/WorkoutRecapTests.swift
      - path: PeptideTests/TrainingAnatomyTests.swift
      - path: PeptideTests/ExerciseAnatomyEngineTests.swift
    dependencies:
      - target: Peptide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peptidesai.app.trainingtests
        GENERATE_INFOPLIST_FILE: YES
  PeptideUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PeptideUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Peptide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peptidesai.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Peptide:
    build:
      targets:
        Peptide: all
        PeptideWidgets: all
        PeptideWatch: all
        PeptideWatchWidgets: all
        PeptideTests: [test]
        PeptideUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Peptide/Resources/Products.storekit
    test:
      config: Debug
      storeKitConfiguration: Peptide/Resources/Products.storekit
      # Pinned so formatter assertions ("60.3 kg") don't depend on the
      # simulator's region: a comma-decimal one such as sv_SE failed them
      # locally while the en_US CI runner passed.
      language: en
      region: US
      # Feeds the Coverage report step in pr-checks.yml; XcodeGen
      # defaults this to false, which left that step reading nothing.
      gatherCoverageData: true
      coverageTargets:
        - Peptide
      targets:
        - PeptideTests
        - PeptideUITests
    archive:
      config: Release

  # UI-capture-only scheme.
  #
  # The `Peptide` scheme's test action also builds and runs `PeptideTests`.
  # This scheme builds the app and the UI tests and nothing else, so the
  # screenshot job doesn't spend time compiling the unit suite.
  PeptideUICapture:
    build:
      targets:
        Peptide: all
        PeptideUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Peptide/Resources/Products.storekit
    test:
      config: Debug
      storeKitConfiguration: Peptide/Resources/Products.storekit
      targets:
        - PeptideUITests

  PeptideTrainingValidation:
    build:
      targets:
        Peptide: all
        PeptideTrainingTests: [test]
    test:
      config: Debug
      language: en
      region: US
      targets:
        - PeptideTrainingTests
